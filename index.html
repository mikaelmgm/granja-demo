    const a = el.sheet.getBoundingClientRect(), b = el.stage.getBoundingClientRect(), side = a.left > b.left + 40;
    R.focus(f[0], f[1], f[2], { right: side ? b.right - a.left : 0, bottom: side ? 0 : b.bottom - a.top });
    R.spot(f[3], 'blur');
  }
  const toggleSheet = (tab) => { if (sheetTab === tab) H.closeSheet(); else H.openSheet(tab); };
  // Tocar numa construção abre o que ela guarda. Celeiro sujo: o toque limpa, com brilho; horta pronta: o toque colhe.
  H.tap = (tipo, i) => {
    if (demo.on) { demoTap(tipo); return; }
    if (busy || guide.on) return;
    if (tipo === 'pen') {
      if (i >= S.pens) H.openSheet('barn');
      else if (isDirty(i)) { cleanPen(i); H.openSheet('barn', i); }
      else H.openSheet('barn', i);
    } else if (tipo === 'fox' || tipo === 'hunter' || tipo === 'pond') H.openSheet('fox', tipo === 'hunter' ? 'cacador' : 'patos');
    else if (tipo === 'next') H.openSheet('barn');
    else if (tipo === 'horta') { if (!S.farmer && S.zones.some((z) => z.seed && z.left <= 0)) harvestAll(); else H.openSheet('horta'); }
    else if (tipo === 'abat' || tipo === 'truck' || tipo === 'bin') H.openSheet('prod', tipo === 'bin' ? 'caixa' : tipo);
    else if (tipo === 'house') H.openSheet('horta', 'fazendeiro');
    else if (tipo === 'market') H.openSheet('market');
  };

  // ---------- API de teste (aba Testnet): nada aqui soma em invested nem earned

  const tested = (kind) => { emit('test', { kind }); ui(); save(); };
  H.test = {
    add(tipo, valor) {
      const v = +valor || 0;
      if (tipo === 'nug') { S.nug = Math.max(0, S.nug + v); bump(); } else if (tipo === 'sol') S.sol = Math.max(0, S.sol + v);
      tested('add');
    },
    speed(x) { if (x > 0) S.speed = x; tested('speed'); },
    foxNow() { if (!W.fox && W.hens.length) spawnFox(); tested('fox'); },
    dirtAll() { for (let i = 0; i < S.pens; i++) S.dirt[i] = 1; tested('dirt'); },
    fillBox() { S.vault = cap(); tested('box'); },
    addEgg() { if (W.hens.length) layEgg(pick(W.hens)); tested('egg'); },
    fillNest() { while (W.hens.length && S.eggs.length < CFG.nestMax) layEgg(pick(W.hens), true); tested('nest'); },
    // quase pronto: o próximo passo dispara chocReady pelo caminho normal
    eggReady() { const i = Math.max(0, W.hens.length ? W.hens[0].pen : 0); if (!S.choc[i] || S.choc[i].left > 0) S.choc[i] = { left: 0.0001 }; tested('choc'); },
    // canteiros vazios ganham milho; todos ficam quase prontos
    plotReady() { S.zones.forEach((z) => { if (!z.seed) { z.seed = 'milho'; z.last = 'milho'; } z.left = Math.min(z.left || 1, 0.0001); }); tested('plot'); },
    thiefNow() { if (!W.thief && S.hens.length) { S.thieves++; spawnThief(); } tested('thief'); },
    // galinhas de graça, até o limite de vagas: leva aos celeiros novos sem pagar ovo
    addHens(n) { for (let k = Math.min(n, slots() - S.hens.length); k > 0; k--) { S.hens.push(newHen(0, freePen())); S.got++; coopCheck(); } syncHens(); tested('hens'); },
    birdsNow() { if (!S.zones.some((z) => z.seed && z.left > 0)) plantZone(0, 'milho', true, true); S.nextBird = 0.0001; tested('birds'); },
    away(horasDeJogo) { const info = catchUp(horasDeJogo * 3600 / S.speed, true); tested('away'); return info; },
    showcase() { loadShowcase(); tested('showcase'); },
    reset() { wipe(); tested('reset'); },
    // roda a simulação na hora, sem depender de requestAnimationFrame (painel oculto)
    run(seg) { for (let n = Math.ceil(seg * 30); n > 0; n--) (demo.on ? demoStep : step)(1 / 30); ui(); return W.hour; },
    state() {
      return JSON.parse(JSON.stringify(Object.assign({}, S, { cap: cap(), rate: rate(), mult: PENS.map((p, i) => penMult(i)), full: W.full, fill: W.fill,
        tod: W.tod, penUi: W.penUi, fox: W.fox && W.fox.state, thief: W.thief && W.thief.state, gross: gross(), boost: boost(), foxRoute: W.fox ? W.fox.route : -1, foxBiting: foxBiting(), chicks: W.chicks.length, inflightV: W.inflightV, busy, lang: I18N.lang })));
    },
  };

  // ---------- interface

  function bump() { el.bal.classList.remove('bump'); void el.bal.offsetWidth; el.bal.classList.add('bump'); }
  // Só resultado ou erro. Instrução é papel do #cue.
  const held = [];
  function toast(html, kind, ms) {
    if (!el.ovWallet.hidden || !el.ovReveal.hidden) { held.push(html); return; }

    while (el.toasts.children.length > 2) (el.toasts.querySelector('.toast:not(.t-sum)') || el.toasts.firstChild).remove();
    setTimeout(() => t.classList.add('out'), ms || 3000);
    setTimeout(() => t.remove(), (ms || 3000) + 500);

  // Estrelinhas de brilho: limpar, melhorar e abrir ovo têm que dar gosto.
  function stars(box, n) {
    for (let i = 0; i < n; i++) {

  let resetArm = 0;

    if (Date.now() - resetArm > 3000) {

  function build() {

      ['Jogo', [['+8 ' + t('h'), () => H.test.away(8)], [t('Granja de exemplo'), () => { H.test.showcase(); H.closeSheet(); }], [resetTxt(), resetTap]]],

  // ---------- estilos visuais (os três desenhos vivem na mesma página)

  const renderers = {};
  const STYLE_KEY = 'granja-style-v4';
  const STYLES = ['maquete', 'voxel', 'pixel'];             // saves com 'iso' ou 'mini' caem no padrão
  H.register = (name, r) => { renderers[name] = r; };
  // recuo: estilo usado porque o escolhido não abre aqui; a escolha salva fica intacta, para o 3D voltar quando puder
  function setStyle(name, recuo) {
    if (!STYLES.includes(name) || !renderers[name] || (R && R === renderers[name])) return;
    if (R && R.destroy) R.destroy();
    // o canvas da revelação troca junto: WebGL e 2D não podem dividir o mesmo canvas
    const cnv = document.createElement('canvas');
    cnv.width = 480; cnv.height = 480; cnv.id = 'revCanvas';
    el.revCanvas.replaceWith(cnv); el.revCanvas = cnv;
    R = renderers[name];
    document.documentElement.dataset.style = name;
    press(el.styles, 's', name);
    el.pFinish.hidden = name !== 'maquete';
    try {
      R.init(el.stage);
      R.resize(el.stage.clientWidth, el.stage.clientHeight);
      if (R.setContour) R.setContour(S.contour !== false);
    } catch (e) {
      console.error(e);
      // sem WebGL o 3D não abre: o estilo sai de Ajustes e o jogo segue no próximo que funcione
      try { R.destroy(); } catch (e2) { /* ignora */ }
      delete renderers[name]; R = null;
      const b = el.styles.querySelector('[data-s=' + name + ']');
      if (b) b.remove();
      setStyle(STYLES.find((s) => renderers[s]), true);
      return;
    }
    if (!recuo) try { localStorage.setItem(STYLE_KEY, name); } catch (e) { /* ignora */ }
  }

  // ---------- laço principal

  let last = 0, uiClock = 0, saveClock = 0, running = false, hidAt = 0;
  function loop(now) { requestAnimationFrame(loop); frame(now); }
  // Painéis escondidos pausam o requestAnimationFrame; este relógio de reserva mantém a granja andando.
  setInterval(() => { const now = performance.now(); if (running && now - last > 300) frame(now); }, 100);
  function frame(now) {
    if (now - last < 8) return;
    const raw = last ? (now - last) / 1000 : 0, dt = Math.min(raw, 0.05), hid = document.hidden;
    last = now;
    // tutorial aberto: a granja do jogador fica parada; quem anda é a de exemplo
    if (guide.on) {
      if (demo.on) { demoStep(dt); uiClock += dt; if (uiClock > 0.1) { uiClock = 0; ui(); } }
      R.frame(W, dt);

    '      if (e < best) { best = e; pick = texture2D(tPal, vec2(u, 0.75)).rgb; }',
    '    }',
    '    c = pick;',
    '  } else {',
    // céu: 9 faixas da cor do horizonte até a do topo, com dither Bayer só na transição
    '    vec2 cell = floor(vUv / px);',
    '    float band = floor(vUv.y * 8.0 + 0.2 + bayer4(cell) * 0.6) / 8.0;',

    '  float ey = (d0 - min(u, b)) * step(thl, abs(u + b - 2.0 * d0));',

  const SLAB = { x0: -23, x1: 22.5, z0: -14.5, z1: 18.5, r: 3.4 };
  function inSlab(x, z, m) {
    const cx = Math.max(SLAB.x0 + SLAB.r, Math.min(SLAB.x1 - SLAB.r, x)), cz = Math.max(SLAB.z0 + SLAB.r, Math.min(SLAB.z1 - SLAB.r, z));

    s.moveTo(x0 + r, z0); s.lineTo(x1 - r, z0); s.absarc(x1 - r, z0 + r, r, -Math.PI / 2, 0, false);

  // Placa de texto em canvas: o tamanho da letra encolhe até caber, porque a tradução pode ser bem mais comprida.
  function signTexture(text, o) {
    o = o || {};

    const g = c.getContext('2d');
    g.fillStyle = o.edge || '#2a1b2e'; g.fillRect(0, 0, W, H);
    g.fillStyle = o.bg || '#fff3c4'; g.fillRect(b, b, W - b * 2, H - b * 2);
    g.fillStyle = o.fg || '#c8453a'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let px = Math.round(H * 0.58);
    do { g.font = '800 ' + px + 'px Nunito, "Arial Black", sans-serif'; px -= 2; } while (g.measureText(text).width > W - b * 4 && px > 12);
    g.fillText(text, W / 2, H * 0.54);
    return new T.CanvasTexture(c);

  // ---------- partículas em cubos

  function Pool(n, mat, shadow) {
    this.mesh = new T.InstancedMesh(boxGeo, mat, n);
    this.mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = !!shadow;
    this.p = []; this.n = n; this.i = 0; this.t = 0;
    for (let k = 0; k < n; k++) { this.p.push({ on: false }); this.mesh.setMatrixAt(k, ZERO); this.mesh.setColorAt(k, col.set('#ffffff')); }
  }
  Pool.prototype.add = function (o) {
    const k = this.i;
    this.i = (this.i + 1) % this.n;
    const p = this.p[k];
    Object.assign(p, { on: true, life: 0, g: 0, floor: null, rb: false, fire: false, vx: 0, vy: 0, vz: 0, spin: 4, keep: false }, o);
    p.rot = Math.random() * 6;
    this.mesh.setColorAt(k, col.set(o.col || '#ffffff'));
    this.mesh.instanceColor.needsUpdate = true;
  };
  Pool.prototype.update = function (dt) {
    let colors = false;
    this.t += dt;
    for (let k = 0; k < this.n; k++) {
      const p = this.p[k];
      if (!p.on) continue;
      p.life += dt;
      if (p.life >= p.max) { p.on = false; this.mesh.setMatrixAt(k, ZERO); continue; }
      p.vy -= p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.floor != null && p.y < p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.55; p.vz *= 0.55; p.spin *= 0.5; }
      const left = 1 - p.life / p.max;
      p.rot += p.spin * dt;
      if (p.rb) { this.mesh.setColorAt(k, col.setHSL((this.t * 0.7 + k * 0.05) % 1, 1, 0.62)); colors = true; }
      else if (p.fire) { this.mesh.setColorAt(k, col.set(left > 0.65 ? '#fff3b0' : left > 0.35 ? '#ffb13d' : '#ff4a1f')); colors = true; }
      const sc = p.size * (p.keep ? Math.min(1, left * 4) : left);
      eul.set(p.rot, p.rot * 0.7, 0); quat.setFromEuler(eul);
      vpos.set(p.x, p.y, p.z); vscl.set(sc, sc * (p.flat || 1), sc);
      mtx.compose(vpos, quat, vscl);
      this.mesh.setMatrixAt(k, mtx);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    if (colors) this.mesh.instanceColor.needsUpdate = true;
  };
  function burst(pool, x, y, z, n, colr, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, e = (Math.random() - 0.3) * Math.PI * 0.8, sp = (o.speed || 3) * (0.4 + Math.random() * 0.8);
      pool.add({
        x, y, z, vx: Math.cos(a) * Math.cos(e) * sp, vy: Math.sin(e) * sp + (o.up || 0), vz: Math.sin(a) * Math.cos(e) * sp,
        g: o.g == null ? 7 : o.g, max: (o.life || 0.5) * (0.6 + Math.random() * 0.7), size: (o.size || 0.12) * (0.7 + Math.random() * 0.6),
        col: Array.isArray(colr) ? colr[i % colr.length] : colr, rb: o.rainbow, fire: o.fire, floor: o.floor, keep: o.keep, spin: o.spin == null ? 6 : o.spin,
      });
    }
  }

  // ---------- sprites macios: quadrados virados para a câmera, com cor e transparência por instância. Vapor, fumaça e estrelinhas.

  const softPatch = (sh) => {
    sh.vertexShader = 'attribute float aAlpha; varying float vAlpha;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vAlpha = aAlpha;');
    sh.fragmentShader = 'varying float vAlpha;\n' + sh.fragmentShader.replace('#include <map_fragment>', '#include <map_fragment>\n  diffuseColor.a *= vAlpha;');
  };
  function Soft(n, tex, add) {
    const geo = new T.PlaneGeometry(1, 1), mat = new T.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, blending: add ? T.AdditiveBlending : T.NormalBlending });
    this.alpha = new T.InstancedBufferAttribute(new Float32Array(n), 1);
    this.alpha.setUsage(T.DynamicDrawUsage);
    geo.setAttribute('aAlpha', this.alpha);
    mat.onBeforeCompile = (sh) => { softPatch(sh); clipPatch(sh); };
    this.mesh = new T.InstancedMesh(geo, mat, n);
    this.mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
    this.mesh.frustumCulled = false; this.mesh.renderOrder = 4;
    this.p = []; this.n = n; this.i = 0; this.live = 0;
    for (let k = 0; k < n; k++) { this.p.push({ on: false }); this.mesh.setMatrixAt(k, ZERO); this.mesh.setColorAt(k, col.set('#ffffff')); }
  }
  // size e grow: tamanho no começo e no fim; a: transparência no auge; tw: quanto pisca (estrelinha); fade: fração da vida gasta acendendo
  Soft.prototype.add = function (o) {
    const k = this.i, p = this.p[k];
    this.i = (this.i + 1) % this.n;
    if (!p.on) this.live++;
    Object.assign(p, { on: true, life: 0, g: 0, vx: 0, vy: 0, vz: 0, spin: 0, rot: Math.random() * 6, a: 1, tw: 0, ph: Math.random() * 6, fade: 0.15, grow: null }, o);
    this.mesh.setColorAt(k, col.set(o.col || '#ffffff'));
    this.mesh.instanceColor.needsUpdate = true;
  };
  Soft.prototype.update = function (dt, cq) {
    if (!this.live) return;
    for (let k = 0; k < this.n; k++) {
      const p = this.p[k];
      if (!p.on) continue;
      p.life += dt;
      if (p.life >= p.max) { p.on = false; this.live--; this.mesh.setMatrixAt(k, ZERO); this.alpha.array[k] = 0; continue; }
      p.vy -= p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.rot += p.spin * dt;
      const t = p.life / p.max, sc = p.grow == null ? p.size : p.size + (p.grow - p.size) * t;
      const flick = p.tw ? 1 - p.tw * (0.5 + 0.5 * Math.sin(p.life * 16 + p.ph)) : 1;
      this.alpha.array[k] = p.a * flick * (t < p.fade ? t / p.fade : 1 - (t - p.fade) / (1 - p.fade));
      quat.copy(cq).multiply(qtmp.setFromAxisAngle(ZAXIS, p.rot));
      const s = sc * (p.tw ? 0.75 + 0.5 * flick : 1);
      mtx.compose(vpos.set(p.x, p.y, p.z), quat, vscl.set(s, s, s));
      this.mesh.setMatrixAt(k, mtx);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    this.alpha.needsUpdate = true;
  };
  // Modo direto: em vez de nascer e morrer, cada quadro escreve os sprites de novo. É o que as galinhas especiais usam: nada acumula e o retrato usa a mesma conta.
  Soft.prototype.put = function (x, y, z, s, a, hex, cq, rot) {
    const k = this.i;
    if (k >= this.n) return;
    this.i = k + 1;
    quat.copy(cq);
    if (rot) quat.multiply(qtmp.setFromAxisAngle(ZAXIS, rot));
    mtx.compose(vpos.set(x, y, z), quat, vscl.set(s, s, s));
    this.mesh.setMatrixAt(k, mtx);
    this.mesh.setColorAt(k, col.setHex(hex));
    this.alpha.array[k] = a;
  };
  Soft.prototype.flush = function () {
    this.mesh.count = this.i; this.i = 0;
    this.mesh.instanceMatrix.needsUpdate = true;
    this.mesh.instanceColor.needsUpdate = true;
    this.alpha.needsUpdate = true;
  };
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new T.CanvasTexture(c); };
  // nuvem branca: várias manchas redondas que somem na borda
  const puffTex = () => canvasTex(64, 64, (g) => {
    for (const [x, y, r] of [[32, 32, 30], [22, 26, 18], [42, 24, 16], [24, 42, 16], [44, 42, 17]]) {
      const c = g.createRadialGradient(x, y, 0, x, y, r);
      c.addColorStop(0, 'rgba(255,255,255,.75)'); c.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = c; g.fillRect(0, 0, 64, 64);
    }
  });
  // estrelinha de quatro pontas com miolo macio
  const starTex = () => canvasTex(64, 64, (g) => {
    g.translate(32, 32);
    const c = g.createRadialGradient(0, 0, 0, 0, 0, 22);
    c.addColorStop(0, 'rgba(255,255,255,1)'); c.addColorStop(0.3, 'rgba(255,255,255,.5)'); c.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = c; g.fillRect(-32, -32, 64, 64);
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.beginPath(); g.moveTo(0, -31); g.lineTo(5, -5); g.lineTo(-5, -5); g.closePath(); g.fill(); }
  });
  const glowTex = () => canvasTex(128, 128, (g) => {
    const c = g.createRadialGradient(64, 64, 4, 64, 64, 64);
    c.addColorStop(0, 'rgba(255,255,255,1)'); c.addColorStop(0.55, 'rgba(255,255,255,.55)'); c.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = c; g.fillRect(0, 0, 128, 128);
  });

  // ---------- enfeites do sítio, montados com as peças de cada kit

  // Açude, horta e poleiro ficam em grupos próprios: o destaque do tutorial e o contorno precisam deles separados do cenário assado.
  function buildDecor(kit, scene) {
    const D = DECOR, own = () => { const g = new T.Group(); g.userData.live = true; scene.add(g); return g; };
    const P = { pond: own(), horta: own(), perch: own() };
    const rectXZ = (o) => [X(o.x + o.w / 2), Z(o.z + o.d / 2), o.w * U, o.d * U];
    // açude
    const [px, pz, pw, pd] = rectXZ(D.pond);
    if (kit.pond) kit.pond(P.pond, px, pz, pw, pd);
    else {
      kit.block(pw + 0.6, 0.06, pd + 0.6, '#d9c08a', px, 0.02, pz, P.pond).castShadow = false;
      kit.block(pw, 0.08, pd, '#4aa8e8', px, 0.04, pz, P.pond).castShadow = false;
      kit.block(pw * 0.5, 0.09, pd * 0.25, '#7cc4f2', px - pw * 0.15, 0.045, pz - pd * 0.2, P.pond).castShadow = false;
    }
    // horta: quatro canteiros de terra arada, um atrás do outro, com três sulcos e borda de tábua; as plantas, os trabalhadores e os passarinhos são do motor
    for (const zn of MAP.zones) {
      const [zx, zz, zw, zd] = rectXZ(zn);
      kit.block(zw + 0.2, 0.05, zd + 0.2, '#6b4a2e', zx, 0.02, zz, P.horta).castShadow = false;

      for (const s of [-1, 1]) {
        kit.block(zw + 0.3, 0.12, 0.07, '#a8703f', zx, 0.08, zz + s * (zd / 2 + 0.08), P.horta);
        kit.block(0.07, 0.12, zd + 0.3, '#a8703f', zx + s * (zw / 2 + 0.11), 0.08, zz, P.horta);

    const fz0 = Z(D.fence.z0), fz1 = Z(D.fence.z1), fx0 = X(D.fence.x0), fx1 = X(D.fence.x1), gate = X(MAP.dock[0]);

      const len = Math.hypot(bx - ax, bz - az);

  const PORTRAIT_K = 0.2 / 0.085 * 0.86;   // a galinha da cena, no tamanho do retrato; sobra margem para asa, coroa e balão
  // ---------- galinhas especiais: a Lendária de ouro e as 10 Míticas
  // Cada uma é a galinha de voxels com material próprio e acessórios numa malha só. fx(t, put, seed) anima o que anda e pede os sprites do quadro:

  const hopFx = (t) => Math.floor(t * 5) % 2;

  // Lendária: ouro polido, com luz em volta e estrelinhas piscando sem parar. Vista de longe, é a mais brilhante do celeiro.

  const SKIN_MAKE = [

      const cape = new T.Group(), p = new Parts();
      cape.position.set(-0.04, 0.72, 0); g.add(cape);

        else if (d.kill) burst(solid, tx, 0.6, tz, 16, ['#ff8a3d', '#e8772e', '#ffffff'], { speed: 2.8, up: 2.5, g: 8, floor: 0.06, life: 1, size: 0.13, keep: true });
        else burst(solid, ex, 0.1, ez, 8, '#c99d63', { speed: 1.4, up: 2, g: 7, floor: 0.04, life: 0.6, size: 0.1 });
      } else if (type === 'build') {
        // a obra começou: o lote vira canteiro de obra, com uma poeirinha subindo
        buildPens();
        const p = MAP.pens[d.pen], px = X(p.x), pz = Z(p.z);
        for (let i = 0; i < 18; i++) puffs.add({ x: px + Math.random() * p.w * U, y: 0.15, z: pz + Math.random() * p.d * U, vx: (Math.random() - 0.5) * 0.3, vy: 0.3 + Math.random() * 0.5, size: 0.4, grow: 1.5, max: 1 + Math.random() * 0.8, a: 0.55, col: '#d9c08a', spin: (Math.random() - 0.5) * 0.6 });
      } else if (type === 'pen') {
        buildPens();
        const p = MAP.pens[d.i];
        burst(glow, X(p.x + p.w / 2), 0.5, Z(p.z + p.d / 2), 34, ['#ffd84d', '#ffffff', '#8fd0ff'], { speed: 3.2, up: 3, g: 4, life: 0.9 });
      } else if (type === 'hunter') {
        setHunter(d.level);
        const [hx, hy, hz] = hunterBase();
        burst(glow, hx, hy + 0.8, hz, 28, ['#ffffff', '#ffd84d', '#cfe3ff'], { speed: 2.6, up: 2.4, g: 3, life: 0.7, size: 0.12 });
      } else if (type === 'crow') {
        const r = d.rooster;
        if (r) popLabel(G.t('Cocoricó!'), X(r.x), ROOST_Y + 1.9, Z(r.z), 'crow');
      } else if (type === 'wake') {
        // o jogador acordou as galinhas do celeiro: um brilhinho na casinha
        if (d.pen != null) { const [x, z] = coopOf(d.pen); twinkle(x, 1.2, z, 12, ['#ffd84d', '#fffbe0'], { speed: 1.8, up: 1, life: 0.7, size: 0.3 }); }
      } else if (type === 'rooster') {
        burst(glow, X(MAP.perch[0]), ROOST_Y + 0.5, Z(MAP.perch[1]), 26, ['#ffd84d', '#ffffff', '#ff9a3a'], { speed: 2.4, up: 3, g: 3, life: 0.8 });
      } else if (type === 'clean') {
        // a varrida atravessa o terreiro de um lado ao outro e o celeiro brilha por 1,5 s; dirtStep e cleanStep cuidam deles
        const p = MAP.pens[d.pen];
        sweeps[d.pen] = { t: 0, d: dirtNow[d.pen] };
        cleanFx[d.pen] = { t: 0, acc: 0 };
        twinkle(X(p.x + p.w / 2), 0.6, Z(p.z + p.d / 2), 90, ['#ffd84d', '#ffe873', '#fffbe0', '#ffc53d'], { speed: 4.6, up: 2.2, life: 1.2, size: 0.5 });
      } else if (type === 'duck') {
        burst(glow, PDX, 0.2, PDZ, 18, ['#ffffff', '#bfe6ff', '#7cc4f2'], { speed: 1.8, up: 2.5, g: 6, life: 0.6, size: 0.09 });
      } else if (type === 'lure') {
        const k = d.fox.duck;
        if (k) popLabel(G.t('Quack!'), X(k.x), 1.5, Z(k.z));
      }
      else if (type === 'mint') {
        const h = d.hen;
        if (h) {
          for (let i = 0; i < 24; i++) glow.add({ x: X(h.x) + (Math.random() - 0.5) * 0.8, y: Math.random() * 0.4, z: Z(h.z) + (Math.random() - 0.5) * 0.8, vy: 2 + Math.random() * 3, max: 0.8, size: 0.1, col: RAR[d.r].cor, rb: RAR[d.r].id === 'mitica' });
          twinkle(X(h.x), 0.7, Z(h.z), 34, [RAR[d.r].cor, '#ffd84d', '#fffbe0'], { speed: 3, up: 1.6, life: 1.1, size: 0.4 });
        }
      } else if (type === 'reset') {
        for (const o of hens.values()) scene.remove(o.root);
        hens.clear(); eggBorn.clear();
        sweeps = [null, null, null, null]; cleanFx = [null, null, null, null];
        buildPens(); setHunter(G.world.hunter);
      }
    }

    // Sujeira de um celeiro no nível d: cada mancha e montinho aparece na sua vez e cresce; edge é a linha da varrida, à esquerda dela já está limpo.
    function placeDirt(i, d, edge) {
      const put = (mesh, list, n, base) => {
        for (let k = 0; k < n; k++) {
          const o = list[i * n + k], g = clamp((d - o.at) / 0.2, 0, 1);
          if (g <= 0 || o.x <= edge) { mesh.setMatrixAt(i * n + k, ZERO); continue; }
          const s = o.s * (0.45 + 0.55 * g) * (0.7 + 0.55 * d);
          eul.set(0, o.rot, 0); quat.setFromEuler(eul);
          mtx.compose(vpos.set(o.x, o.y != null ? o.y : 0.06, o.z), quat, vscl.set(s, base ? s : 1, s));
          mesh.setMatrixAt(i * n + k, mtx);
        }
        mesh.instanceMatrix.needsUpdate = true;
      };
      put(stains, stainAt, STAIN_N, false);
      put(poops, poopAt, POOP_N, true);
    }
    // telhado da casinha: quatro tons de telha na maquete, cor misturada no voxel
    function roofTint(i, d) {
      const rf = penObjs[i] && penObjs[i].userData.roof;
      if (!rf) return;
      if (rf.tex) rf.mat.map = rf.tex[Math.min(3, Math.round(d * 3))];
      else rf.mat.color.copy(rf.base).lerp(col.set('#8f8c86'), d * 0.85);
    }
    function dirtStep(W, dt) {
      let bars = 0;
      MAP.pens.forEach((p, i) => {
        const s = sweeps[i], d = i < W.pens ? W.dirt[i] : 0, key = Math.round(d * 40);
        if (!s && key === dirtKey[i]) return;
        const x0 = X(p.x), x1 = X(p.x + p.w), z0 = Z(p.z), z1 = Z(p.z + p.d), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
        if (s) {
          s.t += dt / 0.55;
          const edge = x0 + (x1 - x0) * Math.min(1, s.t);
          mtx.makeScale(0.18, 0.34, z1 - z0 - 0.3); mtx.setPosition(edge, 0.2, cz);
          sweepBar.setMatrixAt(bars++, mtx);
          for (let k = 0; k < 3; k++) solid.add({ x: edge, y: 0.1, z: z0 + Math.random() * (z1 - z0), vx: 1.6 + Math.random(), vy: 0.8 + Math.random(), g: 5, max: 0.4, size: 0.1, col: '#d9c08a', spin: 3 });
          placeDirt(i, s.d, edge);
          if (s.t >= 1) { sweeps[i] = null; dirtKey[i] = -1; popLabel(G.t('Limpo!'), cx, 1.4, cz); }
          return;
        }
        dirtKey[i] = key; dirtNow[i] = d;
        placeDirt(i, d, -1e9);
        roofTint(i, d);
      });
      sweepBar.count = bars;
      if (bars) sweepBar.instanceMatrix.needsUpdate = true;
      // moscas rodando os montinhos: aparecem com o celeiro bem sujo e chegam a nove no piso
      let nf = 0;
      MAP.pens.forEach((p, i) => {
        if (i >= W.pens || sweeps[i] || dirtNow[i] < 0.5) return;
        const n = Math.ceil((dirtNow[i] - 0.5) / 0.5 * FLY_N);
        for (let k = 0; k < n; k++) {
          const o = poopAt[i * POOP_N + (k * 2) % POOP_N], a = time * (4.1 + k * 0.7) + k * 2.2;
          mtx.makeScale(0.13, 0.09, 0.13); mtx.setPosition(o.x + Math.cos(a) * 0.42 + Math.sin(a * 2.3) * 0.12, 0.5 + Math.sin(a * 3.1) * 0.14, o.z + Math.sin(a * 1.4) * 0.34);
          flies.setMatrixAt(nf++, mtx);
        }
      });
      flies.count = nf;
      if (nf) flies.instanceMatrix.needsUpdate = true;
    }
    // Brilho depois da limpeza: 1,5 s de luz macia no chão e estrelinhas subindo por todo o terreiro.
    function cleanStep(dt) {
      cleanFx.forEach((f, i) => {
        if (!f) return;
        f.t += dt;
        const p = MAP.pens[i], k = f.t / 1.5, m = shines[i];
        if (k >= 1) { cleanFx[i] = null; m.visible = false; return; }
        m.visible = true;
        m.material.opacity = Math.pow(Math.sin(Math.min(1, k * 1.08) * Math.PI), 0.6) * 0.55;
        f.acc += dt * 50;
        for (; f.acc >= 1; f.acc--) {
          sparks.add({ x: X(p.x + 0.5 + Math.random() * (p.w - 1)), y: 0.12 + Math.random() * 0.5, z: Z(p.z + 0.5 + Math.random() * (p.d - 1)), vx: (Math.random() - 0.5) * 0.4, vy: 0.5 + Math.random() * 1.1, vz: (Math.random() - 0.5) * 0.4,
            max: 0.7 + Math.random() * 0.6, size: 0.26 + Math.random() * 0.36, tw: 0.6, col: Math.random() < 0.7 ? '#ffd84d' : '#fffbe0', spin: (Math.random() - 0.5) * 3, fade: 0.2 });
        }
      });
    }

    // sprite de uma galinha especial: da posição dela para o mundo
    const henPut = (k, x, y, z, s, a, hex) => {
      const o = fxHen, c = Math.cos(o.yaw), sn = Math.sin(o.yaw), p = o.root.position;
      (k ? henStar : henGlow).put(p.x + c * x + sn * z, p.y + y, p.z - sn * x + c * z, s, a, hex, camera.quaternion, k ? time * 1.8 : 0);
    };
    // Patos: cada um escolhe um ponto na água, nada até lá mudando um pouco a velocidade, vira devagar, para um tempo e às vezes mete a cabeça na água.
    // Um empurra o outro quando chegam perto e ninguém passa da margem, nem do bote e do trapiche.
    function duckGoal(d) {
      for (let n = 0; n < 14; n++) {
        const a = Math.random() * Math.PI * 2, k = Math.sqrt(Math.random()) * 0.84, x = PDX + Math.cos(a) * k * PDW / 2, z = PDZ + Math.sin(a) * k * PDD / 2;
        if (ROCKS.some(([rx, rz, r]) => Math.hypot(x - rx, z - rz) < r) || ducks.some((o) => o !== d && Math.hypot(x - o.tx, z - o.tz) < 0.85)) continue;
        d.tx = x; d.tz = z; d.go = 0;
        return;
      }
    }
    function duckStep(n, dt) {
      while (ducks.length < n) {
        const d = { x: PDX, z: PDZ, tx: PDX, tz: PDZ, yaw: Math.random() * 6.28, sp: 0, wait: Math.random() * 2.5, dip: 0, ph: Math.random() * 6.28, go: 0 };
        duckGoal(d); d.x = d.tx; d.z = d.tz; ducks.push(d); duckGoal(d);
      }
      ducks.length = Math.min(ducks.length, n);
      for (const d of ducks) {
        if (d.wait > 0) {
          d.wait -= dt; d.sp *= Math.exp(-dt * 2.6);
          if (d.wait <= 0) duckGoal(d);
        } else {
          const dx = d.tx - d.x, dz = d.tz - d.z, dist = Math.hypot(dx, dz);
          d.go += dt;
          d.yaw = angleTo(d.yaw, Math.atan2(-dz, dx), Math.min(1, dt * 2.2));
          const want = (0.27 + 0.1 * Math.sin(time * 0.8 + d.ph) + 0.05 * Math.sin(time * 2.3 + d.ph * 2)) * Math.min(1, dist / 0.4 + 0.2);
          d.sp += (want - d.sp) * Math.min(1, dt * 2);
          if (dist < 0.16 || d.go > 11) { d.wait = 0.7 + Math.random() * 3.8; if (Math.random() < 0.4) d.dip = 1.5; }
        }
        d.x += Math.cos(d.yaw) * d.sp * dt; d.z -= Math.sin(d.yaw) * d.sp * dt;
        d.dip = Math.max(0, d.dip - dt);
      }
      for (let i = 0; i < ducks.length; i++) {
        const a = ducks[i];
        for (let j = i + 1; j < ducks.length; j++) {
          const b = ducks[j], dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz) || 0.01;
          if (l < 0.7) { const k = (0.7 - l) * 0.5 / l; a.x -= dx * k; a.z -= dz * k; b.x += dx * k; b.z += dz * k; }
        }
        for (const [rx, rz, r] of ROCKS) { const dx = a.x - rx, dz = a.z - rz, l = Math.hypot(dx, dz) || 0.01; if (l < r * 0.8) { a.x = rx + dx / l * r * 0.8; a.z = rz + dz / l * r * 0.8; } }
        // margem: elipse um pouco menor que a água
        const ex = (a.x - PDX) / (PDW / 2 * 0.88), ez = (a.z - PDZ) / (PDD / 2 * 0.88), v = Math.hypot(ex, ez);
        if (v > 1) { a.x = PDX + (a.x - PDX) / v; a.z = PDZ + (a.z - PDZ) / v; }
      }
    }
    const angleTo = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * k; };

    function frame(W, dt) {
      if (!renderer) return;
      time += dt;
      if (view) updateCam(dt); else voxelFocus(dt);
      if (penKey !== penNow(W)) buildPens();
      if (!belt || belt.n !== W.pens) buildBelts(W.pens);
      if (abatLv !== (W.abat || 0) || abat.pens !== W.pens) buildAbat(W.abat || 0, W.pens);
      if (binLv !== (W.vaultLv || 0)) buildBin(W.vaultLv || 0);
      if (hunterLv !== W.hunter) setHunter(W.hunter);

      // galinhas
      const seen = new Set();
      for (const h of W.hens) {
        seen.add(h.id);
        let o = hens.get(h.id);
        // save antigo sem skin: a mítica ganha uma fixa pelo número dela
        const skin = h.r === 5 ? (h.d && h.d.skin != null ? h.d.skin : h.id % SKIN_MAKE.length) : -1;
        if (!o || o.r !== h.r || o.skin !== skin) {
          if (o) scene.remove(o.root);
          const root = new T.Group(), pivot = new T.Group(), body = kit.hen(h.r, skin);
          pivot.add(body); root.add(pivot); scene.add(root);
          o = { root, pivot, body, r: h.r, skin, fx: body.userData.fx, seed: h.id * 0.37, yaw: h.dir > 0 ? 0 : Math.PI, lx: h.x, lz: h.z };
          o.straw = new T.Mesh(STRAW_GEO, STRAW_MAT); o.straw.position.y = 0.04; o.straw.visible = false;
          root.add(o.straw);
          hens.set(h.id, o);
        }
        const mx = h.x - o.lx, mz = h.z - o.lz;
        o.lx = h.x; o.lz = h.z;
        if (Math.abs(mx) + Math.abs(mz) > 0.0005) o.yaw = angleTo(o.yaw, Math.atan2(-mz, mx), Math.min(1, dt * 10));
        // dormindo: agachada, de bico para baixo, respirando devagar
        const sitting = h.state === 'sit', la = h.layAnim, nap = sitting && h.zz, sono = nap ? Math.sin(time * 1.9 + o.seed) * 0.03 : 0;
        o.root.position.set(X(h.x), h.state === 'walk' ? Math.abs(Math.sin(h.phase * 10)) * 0.03 : 0, Z(h.z));
        o.root.rotation.y = o.yaw;
        o.pivot.rotation.z = nap ? -0.34 : h.state === 'peck' ? -0.5 * Math.max(0, Math.sin(h.phase * 9)) : 0;
        o.pivot.position.y = nap ? -0.13 : sitting ? -0.08 : 0;
        o.pivot.scale.set(1 + la * 0.08 + sono * 0.5, nap ? 0.74 + sono : sitting ? 0.88 : 1 - la * 0.1, 1 + la * 0.08 + sono * 0.5);
        o.straw.visible = nap;
        if (o.fx) { fxHen = o; o.fx(time, henPut, o.seed); }
      }
      henGlow.flush(); henStar.flush();
      for (const [id, o] of hens) if (!seen.has(id)) { scene.remove(o.root); hens.delete(id); }

      // galo: parado no poleiro, de frente para a estrada, balançando a cabeça. No cocoricó estica o pescoço.
      const rs = W.rooster;
      if (rs && !roosterObj) {
        roosterObj = buildRooster(kit);
        roosterObj.g.position.set(X(rs.x), ROOST_Y, Z(rs.z)); roosterObj.g.rotation.y = -Math.PI / 2;
        scene.add(roosterObj.g);
      }
      if (!rs && roosterObj) { scene.remove(roosterObj.g); roosterObj = null; }
      rays.visible = !!rs && rs.crow > 0;
      if (rs) {
        const o = roosterObj, up = Math.min(1, rs.crow * 4);
        o.neck.rotation.z = rs.crow > 0 ? 0.55 * up + Math.sin(time * 30) * 0.04 : Math.sin(time * 2.4) * 0.14;
        o.neck.scale.y = 1 + 0.32 * up;
        if (rays.visible) {
          const k = 1 - rs.crow;
          o.neck.localToWorld(vpos.set(0.04, 0.42, 0));
          const hx = vpos.x, hy = vpos.y, hz = vpos.z, cq = camera.quaternion;
          for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4, d = 0.55 + k * 0.75;
            vtmp.set(Math.cos(a) * d, Math.sin(a) * d, 0).applyQuaternion(cq);
            quat.copy(cq).multiply(qtmp.setFromAxisAngle(ZAXIS, a - Math.PI / 2));
            mtx.compose(vpos.set(hx + vtmp.x, hy + vtmp.y, hz + vtmp.z), quat, vscl.set(0.1, 0.42 * (1 - k * 0.55), 0.1));
            rays.setMatrixAt(i, mtx);
          }
          rays.instanceMatrix.needsUpdate = true;
        }
      }
      // cansadas: um "z" por celeiro a cada pouco, sobre uma das que dormem na palha
      MAP.pens.forEach((p, i) => {
        const k = Math.floor((time + i * 0.4) / 1.1);
        if (k === zzR[i]) return;
        zzR[i] = k;
        const list = W.hens.filter((h) => h.pen === i && h.zz && h.state === 'sit');
        if (list.length) { const h = list[Math.floor(Math.random() * list.length)]; popLabel(k % 3 ? 'z' : 'Z', X(h.x), 1.0, Z(h.z), 'zz'); }
      });

      // pintinhos: uma malha instanciada só, centenas de cópias; na esteira andam em cima dela
      const n = Math.min(MAX_CHICKS, W.chicks.length);
      for (let i = 0; i < n; i++) {
        const c = W.chicks[i];
        const tgtP = c.wp[Math.min(c.i, c.wp.length - 1)];
        const yaw = Math.atan2(-(tgtP[1] - c.z), tgtP[0] - c.x);
        eul.set(0, yaw, Math.sin(c.ph) * 0.12); quat.setFromEuler(eul);
        const s = (c.gold ? 1.35 : 1) * CHICK_K * Math.min(1.5, 1 + Math.log10(c.n) * 0.25);
        // na esteira: sobe a rampa do portão e segue em cima da tira
        let cy = Math.abs(Math.sin(c.ph)) * 0.07;
        if (c.i >= 1) { const g0 = c.wp[0], up = c.i > 1 ? 1 : Math.min(1, Math.hypot(c.x - g0[0], c.z - g0[1]) * U / BELT_RAMP); cy = 0.04 + (BELT_Y - 0.04) * up + Math.abs(Math.sin(c.ph)) * 0.02; }
        vpos.set(X(c.x), cy, Z(c.z)); vscl.set(s, s, s);
        mtx.compose(vpos, quat, vscl);
        chicks.setMatrixAt(i, mtx);
        chicks.setColorAt(i, col.set(c.gold ? '#ffcf1a' : RAR[c.r].chick));
        if (c.gold && Math.random() < 0.15) glow.add({ x: vpos.x, y: 0.4, z: vpos.z, vy: 0.6, max: 0.4, size: 0.06, col: '#fffbe0' });
      }
      chicks.count = n;
      chicks.instanceMatrix.needsUpdate = true;
      if (chicks.instanceColor) chicks.instanceColor.needsUpdate = true;

      // fumaça das chaminés enquanto chega pintinho, fraquinha sem movimento, e o vapor das torres da usina, sempre
      nugT += dt; steamT += dt; homeT += dt;
      const wx = abat.g.position.x, wz = abat.g.position.z;
      if (abat.smoke.length && nugT > (n ? 0.2 : 0.7)) {
        nugT = 0;
        for (const [x, y, z] of abat.smoke) puffs.add({ x: wx + x, y, z: wz + z, vx: 0.22, vy: 0.75, size: 0.34, grow: 1.25, max: 2.1, a: n ? 0.6 : 0.35, col: abat.lv === 2 ? '#d5d7da' : '#f0f1f2', spin: 0.3 });
      }
      if (abat.steam.length && steamT > 0.075) {
        steamT = 0;
        for (const [x, y, z, r] of abat.steam) puffs.add({ x: wx + x + (Math.random() - 0.5) * r, y, z: wz + z + (Math.random() - 0.5) * r, vx: 0.24 + Math.random() * 0.12, vy: 1.05 + Math.random() * 0.35, vz: -0.08, size: r * 1.2, grow: r * 3.9, max: 2.9 + Math.random() * 0.9, a: 0.8, col: '#ffffff', spin: (Math.random() - 0.5) * 0.3 });
      }
      if (homeT > 1.3) { homeT = 0; puffs.add({ x: HX - 2.12 * HOUSE_K, y: 3.95 * HOUSE_K, z: HZ - 1.1 * HOUSE_K, vx: 0.14, vy: 0.42, size: 0.18, grow: 0.7, max: 2.2, a: 0.4, col: '#f0f1f2' }); }
      if (abat.beacon) abat.beacon.color.setHex(Math.floor(time * 1.4) % 2 ? 0xff3b30 : 0x5a1410);
      if (abat.pulse) abat.pulse.color.setRGB(0.42, 0.78 + Math.sin(time * 2.2) * 0.14, 0.95);
      for (const f of abat.fans) f.rotation.y = time * 5;

      // raposa
      const fx = W.fox;
      if (fx && !foxObj) {
        foxObj = { root: new T.Group(), pivot: new T.Group() };
        const body = kit.fox();
        foxObj.mat = body.children[0].material;
        foxObj.pivot.add(body); foxObj.root.add(foxObj.pivot); scene.add(foxObj.root);
        foxObj.root.scale.setScalar(1.6);
      }

  // Sequência do caminhão: devolve a posição y e o número de caixas na carroceria agora.

    sky = null; skyPrev = null; skyTod = '';       // o céu acompanha o tamanho novo; o próximo quadro refaz
  }
  function destroy() {
    if (cv) cv.remove();
    if (cvTop) cvTop.remove();
    for (const t of [cueArrow].concat(allTags())) if (t) t.remove();
    cvTop = null; ctxTop = null; maskC = null; haloC = null; maskKey = ''; viewTr = ''; viewFx = ''; tagsDim = false; gemT = 0;
    spotNames = null; spotNext = null; spotOn = false; spotK = 0;
    Object.assign(fo, { on: false, k: 0, set: false }); Object.assign(view, { x: 0, y: 0, s: 1 });
    cv = null; ctx = null; bg = null; bgKey = ''; tagNext = null; tagFull = null; tagFox = null; tagHorta = null; cueArrow = null; penTags = []; tracer = null;
    sky = null; skyPrev = null; skyTod = ''; fade = 1;
    truckT = -1; truckQ = false;
    parts.length = 0; pops.length = 0; eggBorn.clear(); sweeps.fill(null); shine.fill(null); lake.length = 0;
  }

  // o contorno é dos estilos 3D: aqui cada coisa já tem o seu traço
  G.register('pixel', { init, resize, frame, event, portrait, destroy, focus, spot, setContour() {}, say(x, z, txt) { pop(up(txt), sx(x), sy(z) - 14, '#ffe066'); } });
})();

<script>
/* GRANJA · sons sintetizados em WebAudio, sem arquivos. Cada som é uma função pequena da tabela SONS: recebe o
   instante t e as opções, agenda osciladores e ruído e devolve quando acaba. Nada nasce antes do primeiro toque. */
(function () {
  'use strict';

  const G = window.GRANJA, KEY = 'granja-sound-v1', VOL = 0.35, VOZES = 10;
  const AC = window.AudioContext || window.webkitAudioContext;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const limite = (x, a, b, pad) => (Number.isFinite(x) ? Math.min(b, Math.max(a, x)) : pad);
  const agora = () => performance.now();

  let ligado = true;
  try { ligado = localStorage.getItem(KEY) !== '0'; } catch (e) { /* sem storage: fica ligado */ }
  function setOn(b) {
    ligado = !!b;
    try { localStorage.setItem(KEY, ligado ? '1' : '0'); } catch (e) { /* ignora */ }
    if (ac) mestre.gain.setTargetAtTime(ligado ? VOL : 0, ac.currentTime, 0.02);
  }

  let ac = null, sai = null, amb = null, mestre = null, chiado = null, morto = !AC;
  let vivos = [], alarmeDe = null, ultGolpe = 0;
  const ult = {};
  const livre = (k, ms) => { const n = agora(); if (k in ult && n - ult[k] < ms) return false; ult[k] = n; return true; };

  // ---------- kit de síntese

  const rota = (p, t, pts, exp) => pts.forEach(([dt, v], i) => (!i ? p.setValueAtTime(v, t + dt) : exp ? p.exponentialRampToValueAtTime(v, t + dt) : p.linearRampToValueAtTime(v, t + dt)));
  const filtro = (tipo, f, q, to, t, d) => {
    const n = ac.createBiquadFilter();
    n.type = tipo; n.Q.value = q; n.frequency.setValueAtTime(f, t);
    if (to) n.frequency.exponentialRampToValueAtTime(to, t + d);
    return n;
  };
  const lfo = (t, d, hz, amp, p) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = hz; g.gain.value = amp; o.connect(g); g.connect(p); o.start(t); o.stop(t + d);
  };
  // sobe em a; sem r cai exponencial até o fim (toque); com r segura e solta nos últimos r segundos
  function env(p, t, d, v, a, r) {
    p.setValueAtTime(0, t); p.linearRampToValueAtTime(v, t + a);
    if (r) { p.setValueAtTime(v, t + d - r); p.linearRampToValueAtTime(0, t + d); } else p.exponentialRampToValueAtTime(0.0001, t + d);
  }

  // Uma voz. f é Hz ou rota [[dt, Hz], ...]; to desliza até o fim; g é rota de volume; lp abre o filtro;
  // fm são formantes [Hz, Q, ganho, até]; vib é [Hz, cents]; trem é [Hz, fundo até .5].
  function tom(t, f, d, { tipo = 'sine', to, v = 0.3, a = 0.004, r, g, lp, q = 0.7, fm, vib, trem, det, out = sai } = {}) {
    const s = ac.createOscillator(), e = ac.createGain();
    s.type = tipo;
    if (Array.isArray(f)) rota(s.frequency, t, f, true);
    else { s.frequency.setValueAtTime(f, t); if (to) s.frequency.exponentialRampToValueAtTime(to, t + d); }
    if (det) s.detune.value = det;
    if (vib) lfo(t, d, vib[0], vib[1], s.detune);
    if (g) rota(e.gain, t, g.map(([dt, x]) => [dt, x * v])); else env(e.gain, t, d, v, a, r);
    let n = s;
    if (lp) n = n.connect(filtro('lowpass', lp, q, null, t, d));
    if (fm) {
      const m = ac.createGain();
      fm.forEach(([hz, fq, ganho, ate]) => { const c = ac.createGain(); c.gain.value = ganho; n.connect(filtro('bandpass', hz, fq, ate, t, d)).connect(c).connect(m); });
      n = m;
    }
    if (trem) { const k = ac.createGain(); k.gain.value = 1 - trem[1]; lfo(t, d, trem[0], trem[1], k.gain); n = n.connect(k); }
    n.connect(e); e.connect(out);
    s.start(t); s.stop(t + d + 0.02);
    return t + d;
  }
  // Ruído filtrado: passa-faixa por padrão; f desliza até to.
  function ruido(t, d, { tipo = 'bandpass', f = 1500, to, q = 1, v = 0.2, a = 0.003, r, out = sai } = {}) {
    const s = ac.createBufferSource(), e = ac.createGain();
    s.buffer = chiado; s.loop = true;
    env(e.gain, t, d, v, a, r);
    s.connect(filtro(tipo, f, q, to, t, d)).connect(e).connect(out);
    s.start(t, rnd(0, 1.5)); s.stop(t + d + 0.02);
    return t + d;
  }
  // sino: parciais curtos por cima do tom, decaimento longo
  function sino(t, f, d, v) {
    tom(t, f * 2.01, d * 0.55, { v: v * 0.3 }); tom(t, f * 3.02, d * 0.3, { v: v * 0.1 });
    return tom(t, f, d, { v, a: 0.006 });
  }
  // n moedas subindo a escala até a altura alto (0 a 1), cada vez mais rápidas e mais fortes
  const ESCALA = [1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];
  function moedas(t, n, v0, v1, alto = 1) {
    let ti = t;
    for (let i = 0; i < n; i++) {
      const k = n > 1 ? i / (n - 1) : 1, f = ESCALA[Math.round(k * alto * (ESCALA.length - 1))] * rnd(0.995, 1.005), v = v0 + (v1 - v0) * k;
      tom(ti, f, 0.2, { v }); tom(ti, f * 1.5, 0.09, { v: v * 0.35 });
      ti += 0.1 - 0.035 * k;
    }
    return ti + 0.2;
  }
  // nota de fanfarra: triângulo com uma oitava fina por cima
  const metal = (t, f, d, v, r) => { tom(t, f * 2, d, { v: v * 0.2, a: 0.008, r }); return tom(t, f, d, { tipo: 'triangle', v, a: 0.008, r }); };

  // ---------- os sons

  const SONS = { __proto__: null,
    tap: (t) => tom(t, 540, 0.055, { to: 300, tipo: 'triangle', v: 0.26 }),
    tique: (t) => tom(t, rnd(1700, 2100), 0.022, { v: 0.09 }),                                    // pintinho virou nugget
    tlim: (t) => tom(t, rnd(2100, 2350), 0.13, { v: 0.05 }),                                     // renda passando, quase inaudível
    brilho: (t) => { [1760, 2349, 3136].forEach((f, i) => tom(t + i * 0.05, f, 0.2, { v: 0.14 })); return t + 0.3; },
    plop: (t) => { tom(t, 190, 0.075, { to: 640, v: 0.85 }); return tom(t + 0.05, 420, 0.09, { to: 260, tipo: 'triangle', v: 0.22 }); },
    bloop: (t) => { tom(t, 170, 0.17, { to: 430, tipo: 'triangle', lp: 900, v: 0.5, a: 0.02 }); return tom(t + 0.14, 230, 0.24, { to: 330, tipo: 'triangle', lp: 800, v: 0.3, a: 0.02 }); },
    sininho: (t) => { [880, 1109, 1319].forEach((f, i) => sino(t + i * 0.17, f, 0.85, 0.26)); return t + 1.2; },
    moedas: (t, o) => { const n = Array.isArray(o.n) ? o.n.length : o.n; return moedas(t, 3 + Math.round(limite(n, 0, 6, 1)), 0.12, 0.24); },
    // ovo rachando: estalos secos que vão ficando mais graves
    racha: (t) => { [0, 0.14, 0.23, 0.38].forEach((dt, i) => { ruido(t + dt, 0.05, { f: 2300 - i * 260, q: 2.5, v: 0.9 }); tom(t + dt, 900 - i * 110, 0.04, { to: 480, tipo: 'triangle', v: 0.18 }); }); return t + 0.46; },
    // sobe com a raridade: mais notas, mais agudo, e brilho no fim a partir da Épica
    fanfarra: (t, o) => {
      const r = Math.round(limite(o.r, 0, 4, 0)), esc = [523, 659, 784, 1047, 1319, 1568, 2093], n = 3 + r, passo = 0.1;
      for (let i = 0; i < n - 1; i++) metal(t + i * passo, esc[i], 0.16, 0.24, 0.05);
      const fim = t + (n - 1) * passo, d = 0.55 + r * 0.12;
      [n - 3, n - 2, n - 1].forEach((i) => metal(fim, esc[i], d, 0.17, d * 0.6));
      if (r >= 2) moedas(fim + 0.08, 2 + r * 2, 0.05, 0.09);
      return fim + Math.max(d, 0.9);
    },
    alarme: (t) => { tom(t, 622, 0.15, { tipo: 'sawtooth', lp: 1500, v: 0.32, a: 0.006, r: 0.04 }); return tom(t + 0.17, 466, 0.2, { tipo: 'sawtooth', lp: 1300, v: 0.32, a: 0.006, r: 0.07 }); },
    mordida: (t) => { [0, 0.09].forEach((dt) => { ruido(t + dt, 0.05, { f: 800, q: 1.6, v: 0.34 }); tom(t + dt, 240, 0.04, { to: 140, tipo: 'triangle', v: 0.14 }); }); return t + 0.15; },
    // quack: serra grave num formante nasal que fecha depressa; o tremor dá o grão de bico
    quack: (t, o) => {
      const v = o.v || 0.8, n = o.n || 2; let fim = t;
      for (let i = 0; i < n; i++) {
        const p = 1 - i * 0.07;
        fim = tom(t + i * 0.2, [[0, 310 * p], [0.05, 275 * p], [0.17, 195 * p]], 0.17, { tipo: 'sawtooth', v, g: [[0, 0], [0.012, 1], [0.07, 0.75], [0.17, 0]], fm: [[1350, 4.5, 2.2, 780], [2500, 7, 0.8, 1700]], trem: [52, 0.3] });
      }
      return fim;
    },
    estampido: (t, o) => {
      ruido(t, 0.26, { tipo: 'lowpass', f: 2400, to: 170, v: 1, a: 0.001 }); tom(t, 150, 0.2, { to: 44, v: 0.8, a: 0.001 });
      return o.kill ? sino(t + 0.17, 1319, 0.45, 0.2) : ruido(t + 0.13, 0.42, { tipo: 'lowpass', f: 900, to: 260, v: 0.2, a: 0.05 });   // ping ou poeira
    },
    // có-có-ri-cóóó: quatro notas ligadas por glide, a última longa e caindo. Duas serras quase iguais em formantes.
    cocorico: (t) => {
      const f = [[0, 520], [0.09, 700], [0.135, 640], [0.25, 850], [0.3, 770], [0.5, 1060], [0.55, 980], [0.8, 1120], [1.3, 860], [1.62, 560]];
      const g = [[0, 0], [0.02, 0.85], [0.1, 0.8], [0.125, 0.14], [0.16, 0.9], [0.27, 0.85], [0.3, 0.14], [0.34, 1], [0.5, 0.95], [0.54, 0.16], [0.59, 1], [1.2, 0.9], [1.62, 0]];
      [[0, 0.5], [31, 0.18]].forEach(([det, v]) => tom(t, f, 1.62, { tipo: 'sawtooth', v, g, det, lp: 3400, fm: [[800, 1.8, 1.5, 1150], [2000, 4, 1, 1700], [3100, 6, 0.4]], vib: [6.5, 22], trem: [37, 0.12] }));
      return t + 1.62;
    },
    sinoManha: (t) => { sino(t, 659, 1.3, 0.28); return sino(t + 0.22, 880, 1.3, 0.2); },
    vassoura: (t) => { [0, 0.21, 0.42].forEach((dt, i) => ruido(t + dt, 0.18, { f: 1900 - i * 160, to: 800, q: 0.9, v: 0.62, a: 0.07, r: 0.1 })); return t + 0.6; },
    // carimbo: pancada macia e duas notas contentes
    carimbo: (t) => {
      tom(t, 175, 0.1, { to: 70, v: 0.7 }); ruido(t, 0.05, { tipo: 'lowpass', f: 900, v: 0.34 });
      tom(t + 0.08, 784, 0.26, { tipo: 'triangle', v: 0.26 }); return tom(t + 0.17, 1175, 0.38, { tipo: 'triangle', v: 0.28 });
    },
    erro: (t) => tom(t, 233, 0.2, { to: 196, tipo: 'triangle', lp: 1000, v: 0.3, a: 0.01, r: 0.06 }),
    aviso: (t) => { tom(t, 698, 0.26, { tipo: 'triangle', v: 0.3 }); return tom(t + 0.17, 932, 0.36, { tipo: 'triangle', v: 0.3 }); },
    bip: (t) => tom(t, 1320, 0.075, { tipo: 'square', lp: 2200, v: 0.14, a: 0.002, r: 0.02 }),
    // buzina dupla, motor saindo (sobe e some) e moedas no tamanho da carga
    caminhao: (t, o) => {
      const fr = limite(o.frac, 0, 1, 0.5);
      [0, 0.21].forEach((dt) => [311, 392].forEach((f) => tom(t + dt, f, 0.15, { tipo: 'sawtooth', lp: 1200, v: 0.26, a: 0.008, r: 0.035 })));
      tom(t + 0.34, 58, 1.5, { to: 125, tipo: 'sawtooth', lp: 480, v: 0.3, a: 0.07, r: 1.25, trem: [17, 0.3] });
      ruido(t + 0.34, 1.2, { tipo: 'lowpass', f: 320, to: 620, v: 0.14, a: 0.08, r: 1 });
      return Math.max(t + 1.85, moedas(t + 0.6, 3 + Math.round(fr * 9), 0.09, 0.13 + fr * 0.34, 0.4 + fr * 0.6));
    },
    // ambiente: tudo baixinho e no canal próprio, que cala com a aba oculta
    passarinho: (t) => {
      const f = rnd(2300, 3100), n = 2 + Math.floor(rnd(0, 3)); let ti = t;
      for (let i = 0; i < n; i++) { tom(ti, [[0, f], [0.035, f * 1.3], [0.08, f * 0.92]], 0.08, { v: 0.06, a: 0.01, r: 0.03, out: amb }); ti += rnd(0.11, 0.17); }
      return ti;
    },
    cacarejo: (t) => {
      const n = 2 + Math.floor(rnd(0, 2)), p = rnd(0.92, 1.08); let ti = t;
      for (let i = 0; i < n; i++) { const d = i === n - 1 ? 0.15 : 0.07; tom(ti, [[0, 360 * p], [d * 0.4, 470 * p], [d, 330 * p]], d, { tipo: 'sawtooth', v: 0.11, a: 0.008, r: 0.03, fm: [[1050, 4, 1.6], [2100, 6, 0.5]], out: amb }); ti += d + 0.055; }
      return ti;
    },
  };

  // ---------- eventos do jogo

  const carimbo = () => { if (livre('carimbo', 150)) play('carimbo'); };
  // eventos frequentes têm intervalo mínimo em ms
  const GAP = { __proto__: null, arrive: 250, income: 3000, eat: 2500, gold: 300, egg: 150, full: 30000 };
  const EV = { __proto__: null,
    collect: (d) => play('caminhao', { frac: d.frac }),
    arrive: () => play('tique'), income: () => play('tlim'), gold: () => play('brilho'),
    egg: () => play('plop'), eggSold: (d) => play('moedas', { n: d.eggs }), incubate: () => play('bloop'), chocReady: () => play('sininho'),
    reveal: (d) => play(d.stage === 'hatched' ? 'fanfarra' : 'racha', { r: d.r }),
    // uma raposa, um alarme: quem chega comendo também avisa, mas quem já avisou não repete
    fox: (d) => {
      if (d.state !== 'come' && d.state !== 'eat') return;
      if (d.fox ? d.fox === alarmeDe : !livre('alarme', 8000)) return;
      alarmeDe = d.fox || null; play('alarme');
    },
    eat: () => play('mordida'),
    lure: () => play('quack', { v: 1.05, n: 2 }), duck: () => play('quack', { v: 0.7, n: 1 }),
    shoot: (d) => play('estampido', { kill: d.kill }),
    wake: () => play('sinoManha'), crow: () => play('cocorico'), clean: () => play('vassoura'),
    pen: carimbo, hunter: carimbo, rooster: carimbo, buy: carimbo,
    error: () => play('erro'), full: () => play('aviso'), test: () => play('bip'),
  };

  function event(type, d) {
    const f = EV[type];
    if (!f || !ac || !ligado) return;
    if (GAP[type]) { if (!livre(type, GAP[type])) return; } else ultGolpe = agora();
    try { f(d || {}); } catch (e) { /* som nunca derruba o jogo */ }
  }
  function play(name, o) {
    const s = SONS[name];
    if (!s || !ac || !ligado) return;
    try {
      if (ac.state !== 'running') { acorda(); return; }   // suspenso, nada acumula para tocar de uma vez depois
      const t = ac.currentTime + 0.012;
      vivos = vivos.filter((f) => f > t);
      if (vivos.length < VOZES) vivos.push(s(t, o || {}));
    } catch (e) { /* idem */ }
  }

  // ---------- ambiente: de dia passarinhos e um cacarejo ocasional, à tarde mais raros

  function ambiente() {
    if (!ligado || document.hidden) return;
    const W = G.world || {}, c = Math.random();
    const k = W.tod === 'tarde' ? 0.4 : 1;
    if (c < k / 18) play('passarinho');
    else if (c < k * (1 / 18 + 1 / 45)) play('cacarejo');
  }

  // ---------- início: o contexto só nasce com o primeiro gesto

  function acorda() { const p = ac.resume(); if (p && p.catch) p.catch(() => { /* ainda sem gesto */ }); }
  function liga() {
    try {
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.18;
      sai = ac.createGain(); amb = ac.createGain(); mestre = ac.createGain();
      amb.gain.value = document.hidden ? 0 : 1; mestre.gain.value = ligado ? VOL : 0;
      amb.connect(sai); sai.connect(comp); comp.connect(mestre); mestre.connect(ac.destination);
      chiado = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const c = chiado.getChannelData(0);
      for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1;
      setInterval(ambiente, 1000);
    } catch (e) { ac = null; morto = true; }   // sem áudio de verdade: fica mudo
  }
  // o toque em tela só libera o áudio ao soltar, por isso o gesto acorda o contexto em toda a sequência
  function gesto(e) {
    if (morto) return;
    if (!ac) { if (e.type === 'pointerdown' || e.type === 'keydown') liga(); }
    if (ac && ac.state !== 'running') acorda();
  }
  if (!morto) {
    ['pointerdown', 'keydown', 'pointerup', 'touchend', 'click'].forEach((n) => document.addEventListener(n, gesto, { capture: true, passive: true }));
    // clique em botão faz "toc", a menos que a própria ação já tenha soado
    document.addEventListener('click', (e) => {
      if (e.target && e.target.closest && e.target.closest('button')) setTimeout(() => { if (agora() - ultGolpe > 60) play('tap'); });
    }, true);
    document.addEventListener('visibilitychange', () => { if (ac) amb.gain.setTargetAtTime(document.hidden ? 0 : 1, ac.currentTime, 0.05); });
  }

  G.sfx = { event, play, on: () => ligado, setOn };
})();
</script>
