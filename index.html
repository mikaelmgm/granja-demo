<title>Granja</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&family=Press+Start+2P&family=Rubik:wght@500;700&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap">
<style>
/* Layout compartilhado. Cada estilo define os tokens (cores, fontes, bordas) no próprio :root, em app.html. */
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.ico { width: 1em; height: 1em; vertical-align: -0.14em; flex: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* topo: saldo, SOL e engrenagem */
.hud {
  position: relative; z-index: 3; flex: none; box-sizing: border-box;
  display: flex; align-items: center; gap: 14px; min-height: 48px;
  padding-block: env(safe-area-inset-top, 0px) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  background: var(--hud-bg); color: var(--hud-fg);
  border-bottom: var(--hud-line);
}
.bal { margin-inline-end: auto; display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--font-display); font-size: var(--bal-size); line-height: 1; cursor: pointer; }
.bal .ico { color: var(--nug); font-size: 1.15em; }
.bal b { font-weight: inherit; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bal.bump b { animation: bump .32s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); color: var(--gain); } }
.wallet b { font-weight: inherit; }
.gear {
  appearance: none; cursor: pointer; flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
  border: 0; border-radius: var(--radius-in); background: none; color: var(--hud-fg); font-size: 20px;
}
.gear[aria-expanded=true] { background: var(--chip-bg); }
.hud-btns { flex: none; display: flex; }
#btnHelp { font-family: var(--font-display); line-height: 1; }
.tag { padding: 2px 7px; border-radius: 99px; background: var(--chip-bg); color: var(--hud-fg); font-size: var(--ui-xs); white-space: nowrap; }

/* cena */
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--stage-bg); }
#stage[data-tod=dia] { background: #9fd8f5; }
#stage[data-tod=tarde] { background: #f4b98a; }
#stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* rodapé: botão do caminhão e abas */
.dock {
  position: relative; z-index: 3; flex: none;
  padding-block: 8px env(safe-area-inset-bottom, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--dock-bg); color: var(--dock-fg); border-top: var(--dock-line);
}
.dock-in { display: grid; gap: 4px; }
.act {
  appearance: none; cursor: pointer; box-sizing: border-box;
  border: var(--btn-line); border-radius: var(--radius);
  font-family: var(--font-display); font-size: var(--btn-size); line-height: 1.1;
  box-shadow: var(--btn-depth);
  transition: transform .08s, box-shadow .08s, filter .2s, opacity .2s;
}
.act:active:not(:disabled) { transform: translateY(var(--press, 3px)); box-shadow: var(--btn-depth-press); }
.act:disabled { cursor: default; filter: saturate(.55) brightness(.82); }
.act-truck { background: var(--truck); color: var(--truck-fg); --d: var(--truck-d); }
#btnCollect { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-height: 62px; margin-bottom: 6px; padding: 7px 12px 7px; text-align: start; }
#btnCollect .bar { height: 10px; }
.tr-top { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.tr-top .pic { width: 26px; height: 26px; }
#uTruckTxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* a parte da caixa pode ser cortada; o valor recebido fica sempre inteiro */
.tr-sub { display: flex; min-width: 0; min-height: 1.15em; font-family: var(--font-ui); font-size: var(--btn-small); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
#uCrate { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#uCollectVal { flex: none; white-space: pre; }
.bar { display: block; box-sizing: border-box; height: 8px; border-radius: var(--bar-radius); background: var(--bar-bg); overflow: hidden; border: var(--bar-line); }
.bar i { display: block; height: 100%; width: 0; background: var(--bar-ok); transition: width .15s linear; }
[data-crate=high] .bar i { background: var(--bar-low); }
[data-crate=full] .bar i { background: var(--bad); }
[data-crate=full] .act-truck:not(:disabled), .act-truck.hot:not(:disabled) { animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-3px); filter: brightness(1.1); } }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 60px; }
.tabs button {
  appearance: none; cursor: pointer; position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 0; padding: 0 2px;
  border: 0; border-radius: var(--radius-in) var(--radius-in) 0 0; background: none; color: var(--muted);
  font-family: var(--font-ui); font-size: var(--tab-size); font-weight: 800; line-height: 1.1;
}
.tabs .pic { width: 30px; height: 30px; }
.tabs button[aria-expanded=true] { background: var(--tab-on); color: var(--tab-on-fg); }
/* cinco abas no celular: o rótulo mais longo (Produção) precisa caber */
@media (max-width: 420px) { .tabs button { font-size: min(var(--tab-size), 11.5px); letter-spacing: -.2px; } }
.tab-dot { position: absolute; top: 4px; left: calc(50% + 11px); width: 11px; height: 11px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--dock-bg); }

/* folha: abre dentro da cena e nunca cobre a dock */
.panel {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 72%;
  display: flex; flex-direction: column;
  background: var(--sheet-bg); color: var(--sheet-fg); border-top: var(--sheet-line);
  border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
  box-shadow: 0 -12px 30px -14px rgba(30, 18, 10, .6);
  animation: sheetUp .2s ease-out;
}
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } }
.panel-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 2px 4px 2px 16px; }
.panel-head h3 { margin: 0; font-family: var(--font-display); font-size: var(--sheet-title); font-weight: inherit; }
.panel-x { appearance: none; cursor: pointer; flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--sheet-fg); font: inherit; font-size: 26px; line-height: 1; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 16px 16px; }
.pane { display: grid; gap: 10px; }
.p-lead { margin: 0; font-size: var(--ui-m); font-weight: 700; }
.p-card { display: grid; gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--sheet-inset); border: 2px solid transparent; }
.p-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.p-txt { display: grid; gap: 2px; min-width: 0; font-size: var(--ui-m); }
.p-txt span, .p-sub { margin: 0; font-size: var(--ui-s); color: var(--sheet-muted); line-height: 1.3; }
.p-name { margin: 0; font-size: var(--ui-m); font-weight: 700; }
.p-lead.bad, .p-sub.bad { color: var(--bad); }
.p-btn {
  appearance: none; cursor: pointer; flex: none; min-height: 44px; min-width: 44px; padding: 4px 14px; box-sizing: border-box;
  border: var(--sheet-btn-line); border-radius: var(--radius-in); background: var(--accent); color: var(--accent-fg);
  font: inherit; font-size: var(--ui-m); font-weight: 800; line-height: 1.1;
}
.p-btn:disabled { cursor: default; opacity: .5; }
.p-btn.ghost { background: transparent; color: var(--sheet-fg); box-shadow: inset 0 0 0 2px var(--sheet-muted); }
.p-btn[aria-pressed=true] { background: var(--seg-on); color: var(--seg-on-fg); box-shadow: none; }
.p-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.p-btns.one { grid-template-columns: 1fr; }
.t-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.t-grid .p-btn { padding-inline: 4px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 3px; border-radius: var(--radius); background: var(--seg-bg); border: var(--seg-line); }
.seg button {
  appearance: none; cursor: pointer; min-height: 44px; min-width: 0; padding: 0 4px; border: 0; border-radius: var(--radius-in); background: none;
  font-family: var(--font-ui); font-size: var(--seg-size); font-weight: 800; color: var(--seg-fg);
}
.seg button[aria-pressed=true] { background: var(--seg-on); color: var(--seg-on-fg); }
/* sementes de um canteiro vazio e fusão (− + Fundir): botões lado a lado */
.seeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fuse { display: grid; gap: 6px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--sheet-muted) 50%, transparent); }
.fuse-btns { display: grid; grid-template-columns: 48px 48px 1fr; gap: 6px; }
.pane .bar { --bar-ok: var(--accent); border: 0; }
.pane .bar i { transition: width .3s linear; }

/* avisos: resultado ou erro aqui em cima; instrução no #cue */
.toasts {
  position: absolute; z-index: 5; left: 12px; right: 12px; top: 10px;
  display: grid; justify-items: center; gap: 6px; pointer-events: none;
}
.toast {
  max-width: min(520px, 100%); box-sizing: border-box; padding: 8px 14px; border-radius: var(--radius); font-size: var(--ui-m); line-height: 1.3; text-align: center;
  background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--toast-shadow); border: var(--toast-line);
  animation: tin .25s ease-out;
}
.toast.t-bad { color: var(--bad); }
.toast.t-gold { background: #ffd84d; color: #3a2a00; }

/* tutorial do começo: cartão sobre a cena; a câmera anda até o que o passo explica. A cena fica sem cor e só o que está sendo explicado brilha; o mesmo vale para a interface. */
.guide {
  position: absolute; z-index: 7; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px; padding: 18px;
  background: var(--sheet-bg); color: var(--sheet-fg); border: var(--sheet-line); border-radius: var(--sheet-radius); box-shadow: var(--sheet-shadow);
  animation: guideIn .22s ease-out;
}
@keyframes guideIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)) scale(.97); } }
.guide > * { flex: none; }
.guide > .g-main { flex: 0 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 10px; }
.guide h3 { margin: 0; text-align: center; font-family: var(--font-display); font-size: var(--sheet-title); font-weight: inherit; }
.guide p { margin: 0; font-size: var(--ui-m); line-height: 1.38; }
.g-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.g-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--sheet-muted); opacity: .35; }
.g-dots i.on { opacity: 1; background: var(--accent); }
.g-nav { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; }
.g-nav.two { grid-template-columns: 1fr 1fr; }
.g-nav button { appearance: none; cursor: pointer; min-height: 46px; padding: 8px 12px; border-radius: var(--radius); font: inherit; font-size: var(--ui-m); font-weight: 800; border: var(--sheet-btn-line); }
.g-nav button:disabled { opacity: .4; cursor: default; }
.g-nav .g-skip { border: 0; background: none; color: var(--sheet-muted); font-weight: 600; padding-inline: 6px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* aviso único no pé da cena */
.cue {
  position: absolute; z-index: 3; left: 50%; bottom: 10px; transform: translateX(-50%); box-sizing: border-box;
  display: flex; align-items: center; gap: 4px 10px; width: max-content; min-height: 48px; max-width: min(560px, calc(100% - 24px));
  padding: 2px 2px 2px 14px; border-radius: var(--radius); background: var(--toast-bg); color: var(--toast-fg);
  border: var(--toast-line); box-shadow: var(--toast-shadow); font-size: var(--ui-m); line-height: 1.25;
  animation: cueIn .3s cubic-bezier(.2, 1.4, .4, 1);
}
.cue p { margin: 0; flex: 1; min-width: 0; padding-block: 6px; }
.cue b { font-weight: 800; }
.cue.p1 { background: var(--bad); color: var(--bad-fg); padding-right: 4px; }
.cue-live { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cue-go {
  flex: none; appearance: none; cursor: pointer; min-height: 44px; padding: 0 14px; border: var(--btn-line); border-radius: var(--radius-in);
  background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 800; white-space: nowrap;
}
.cue.p1 .cue-go { background: var(--toast-bg); color: var(--toast-fg); }
.cue-x { flex: none; appearance: none; cursor: pointer; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: inherit; opacity: .7; font: inherit; font-size: 22px; line-height: 1; }
@keyframes cueIn { from { transform: translate(-50%, 12px); opacity: 0; } }
/* seta que pula em cima do alvo do aviso */
.cue-arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.cue-arrow::before {
  content: ""; position: absolute; left: -10px; top: -24px; border: 10px solid transparent; border-top: 15px solid var(--accent);
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); animation: cueBob .8s ease-in-out infinite;
}
.cue-arrow.up::before { top: -58px; }
@keyframes cueBob { 50% { transform: translateY(-7px); } }
.plot-tag.hot { animation: plotHot 1s ease-in-out infinite; }
@keyframes plotHot { 50% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); } }

/* janelas por cima de tudo: carteira e revelação */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-items: safe center; overflow-y: auto; padding: 16px; background: var(--overlay); }
.sheet {
  width: min(380px, 100%); box-sizing: border-box; display: grid; gap: 12px; padding: 20px;
  background: var(--sheet-bg); color: var(--sheet-fg); border: var(--sheet-line); border-radius: var(--sheet-radius); box-shadow: var(--sheet-shadow);
  animation: pop .22s ease-out;
}
@keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } }
.w-head { display: flex; align-items: center; gap: 8px; font-size: var(--ui-s); color: var(--sheet-muted); }
.w-ind { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.w-addr { margin-inline-start: auto; font-variant-numeric: tabular-nums; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: var(--sheet-title); font-weight: inherit; }
.w-rows { margin: 0; display: grid; gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--sheet-inset); }
.w-rows div { display: flex; justify-content: space-between; gap: 12px; font-size: var(--ui-m); }
.w-rows dt { color: var(--sheet-muted); }
.w-rows dd { margin: 0; font-variant-numeric: tabular-nums; text-align: end; }
.odds { display: flex; flex-wrap: wrap; gap: 6px; }
.odds span { font-size: var(--ui-xs); padding: 3px 7px; border-radius: 99px; border: 1px solid var(--c); color: var(--sheet-fg); background: color-mix(in srgb, var(--c) 22%, transparent); }
.w-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.w-btns button { appearance: none; cursor: pointer; min-height: 46px; padding: 8px 12px; border-radius: var(--radius); font: inherit; font-size: var(--ui-m); font-weight: 800; border: var(--sheet-btn-line); }
.w-no { background: transparent; color: var(--sheet-fg); box-shadow: inset 0 0 0 2px var(--sheet-muted); }
.w-yes { background: var(--accent); color: var(--accent-fg); }
.w-busy { display: flex; align-items: center; gap: 10px; justify-content: center; min-height: 46px; font-size: var(--ui-m); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--sheet-fg) 25%, transparent); border-top-color: var(--accent); animation: spin .7s linear infinite; }
.w-busy.ok .spin { animation: none; border-color: var(--ok); background: var(--ok); }
@keyframes spin { to { transform: rotate(360deg); } }
.w-note { margin: 0; font-size: var(--ui-xs); color: var(--sheet-muted); text-align: center; }

/* revelação: fundo escuro tingido pela raridade, para a Comum clara não sumir */
.ov-reveal {
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc) 34%, var(--reveal-base)), var(--reveal-base) 72%);
  overflow-x: hidden; overflow-y: auto; align-items: safe center;
}
.reveal { position: relative; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--reveal-fg); }
.rays {
  --rs: min(640px, 100vh);   /* centro no ovo (metade de .egg-wrap) e nunca maior que a tela: raio não cria barra de rolagem */
  position: absolute; left: 50%; top: min(120px, 31vw, 17vh); width: var(--rs); height: var(--rs); margin: calc(var(--rs) / -2) 0 0 calc(var(--rs) / -2); overflow: hidden;
  -webkit-mask: radial-gradient(closest-side, #000 15%, transparent 72%); mask: radial-gradient(closest-side, #000 15%, transparent 72%);
  opacity: 0; transition: opacity .4s; pointer-events: none;
}
/* gira dentro de uma caixa parada: os cantos girando não podem criar barra de rolagem na revelação */
.rays::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg, var(--rc) 0deg 7deg, transparent 7deg 22deg); animation: rays 14s linear infinite; }
.hatched .rays { opacity: .45; }
@keyframes rays { to { transform: rotate(360deg); } }
.egg-wrap { position: relative; width: min(240px, 62vw, 34vh); aspect-ratio: 1; max-width: 100%; }
.egg-wrap canvas { width: 100%; height: 100%; display: block; }
.ov-reveal:not(.hatched) .egg-wrap { animation: shake 1.9s ease-in forwards; }
@keyframes shake {
  0% { transform: rotate(0); } 12% { transform: rotate(-3deg); } 24% { transform: rotate(3deg); }
  36% { transform: rotate(-5deg); } 48% { transform: rotate(5deg); } 60% { transform: rotate(-8deg); }
  70% { transform: rotate(8deg) scale(1.03); } 80% { transform: rotate(-11deg) scale(1.05); }
  90% { transform: rotate(11deg) scale(1.08); } 100% { transform: rotate(0) scale(1.12); }
}
.hatched .egg-wrap { animation: born .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes born { from { transform: scale(.4); } }
.flash { position: absolute; inset: 0; background: var(--rc); opacity: 0; pointer-events: none; }
.hatched .flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
/* fusão: o ovo treme por mais tempo (3,4 s) antes do resultado; falhou, ele fica cinza, a tela pisca escuro e treme */
.fusing:not(.hatched):not(.failed) .egg-wrap { animation-duration: 3.4s; }
.fusing .rev-hint { font-weight: 700; color: var(--reveal-fg); animation: suspense 1.1s ease-in-out infinite; }
@keyframes suspense { 50% { opacity: .55; } }
.failed { background: radial-gradient(circle at 50% 35%, #4a2a2a, var(--reveal-base) 72%); }
.failed .egg-wrap { animation: failed .55s ease-out; filter: grayscale(1) brightness(.7); }
@keyframes failed { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-14px) rotate(-6deg); } 40% { transform: translateX(12px) rotate(5deg); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }
.failed .flash { background: #000; animation: flash .7s ease-out; }
.failed .rev-rar { color: var(--bad); text-shadow: none; }
.failed .rev-pay { color: var(--reveal-muted); }
.failed .place-lbl { display: none; }
/* vários ovos: a grade troca o ovo grande; cada um treme no seu tempo e salta quando racha */
.multi .place-lbl { display: none; }
.multi .egg-wrap { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.egg-grid { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: min(560px, 92vw); }
.egg-grid.ten { width: min(520px, 92vw, 62vh); }
.egg-cell { min-width: 0; display: grid; justify-items: center; gap: 2px; border-radius: var(--radius); padding: 4px 2px 6px; transition: background .3s; }
.egg-cell canvas { width: 100%; aspect-ratio: 1; display: block; }
.egg-cell:not(.out) canvas { animation: shake var(--d) ease-in forwards; }
.egg-cell.out { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 38%, transparent), transparent 70%); }
.egg-cell.out canvas { animation: born .45s cubic-bezier(.2, 1.6, .4, 1); }
.egg-cell span { min-height: 2.4em; font-size: var(--ui-s); line-height: 1.2; color: var(--reveal-muted); font-variant-numeric: tabular-nums; }

    // o próximo celeiro: em obra, com o tempo; senão, o que falta para ele abrir
    const nx = S.pens, c = COOPS[nx];
    W.nextPen = !c ? null : S.build ? { i: nx, txt: t('Em obra'), sub: durTxt(S.build.left), hot: false }
      : { i: nx, txt: t('+ Celeiro') + ' ' + (nx + 1), sub: S.got >= c.hens && c.sol ? solTxt(c.sol) : t('Galinhas') + ' ' + S.got + '/' + c.hens, hot: S.got >= c.hens };
    const hu = W.horta, ready = S.zones.filter((z) => z.seed && z.left <= 0).length;
    const grow = S.zones.filter((z) => z.seed && z.left > 0).sort((a, b) => a.left / zoneRate(a) - b.left / zoneRate(b))[0];
    if (ready) { hu.txt = t('Colher!'); hu.cls = 'ready'; }
    else if (grow) { hu.txt = durTxt(grow.left / zoneRate(grow)); hu.cls = ''; }
    else { const b = foodBoost(); hu.txt = b > 0 ? t('Horta') + ' +' + Math.round(b * 100) + '%' : t('Horta'); hu.cls = ''; }
  }

  // ---------- produção
  // Pintinhos: produção da galinha (por minuto) × horas que ela trabalhou × celeiro limpo, até o que a esteira leva daquele celeiro.
  // Nuggets: cada pintinho vale 4 (dourado vale 40) × bônus da horta × nível do abatedouro.
  const abatMult = () => ABATS[S.abat].mult * CFG.chickNug;
  const beltCap = (i) => BELTS[i].cap * 60;                                     // pintinhos por hora que a esteira de um celeiro leva
  const coopK = (i) => 1 + (COOPS[i].bonus || 0);                               // o último celeiro rende a mais
  const goldK = (r) => 1 + RAR[r].gold * (CFG.goldMult - 1);                    // o bônus médio do pintinho dourado
  // Cada canteiro soma o seu bônus enquanto estiver alimentando: 4 de frutas dão +20%.
  const foodBoost = () => S.zones.reduce((a, z) => a + (z.feed > 0 ? z.boost : 0), 0);
  const boost = () => 1 + foodBoost();
  // nuggets por hora de um celeiro limpo: all conta todas trabalhando (o nominal da caixa e do frete); senão, só as que não estão descansando
  function penRate(i, all, dirty) {
    if (i >= S.pens) return 0;
    let n = 0, v = 0;
    for (const h of S.hens) if (h.pen === i && (all || !h.rest)) { n += h.p * 60; v += h.p * 60 * goldK(h.r); }
    if (!n) return 0;
    const chicks = Math.min(n * (dirty ? penMult(i) : 1), beltCap(i));
    return chicks * (v / n) * abatMult() * coopK(i) * (all ? 1 : boost());
  }
  const gross = () => PENS.reduce((a, p, i) => a + penRate(i, true), 0);
  const rate = () => PENS.reduce((a, p, i) => a + penRate(i, false, true), 0);
  const boxH = () => CFG.vaultLv[S.vaultLv];
  const cap = () => Math.max(500, Math.round(gross() * boxH()));
  // Cansaço: trabalhando, a galinha cansa no tempo da raridade dela (vezes o ritmo dela), de 80 min na Comum a 200 na Mítica; cansada, descansa na cama do celeiro.
  // Sem galo, descansa até 100%. Com galo, só até wakeMin: ele canta e ela volta inteira. Sem poder trabalhar (caixa cheia), fica parada sem cansar. Devolve as horas trabalhadas.
  const restGoal = () => (S.rooster > 0 ? CFG.wakeMin : 1);
  const restMin = (b) => 100 / BEDS[b].rest;                                    // minutos da cama até 100%
  const healOf = (d) => BEDS[d.pen].rest * 0.6, drainOf = (d) => 60 / RAR[d.r].tire * (d.k || 1);    // quanto recupera e quanto gasta por hora
  let crowed = 0;
  function tireHen(d, gh, work) {
    const heal = healOf(d), drain = drainOf(d), goal = restGoal();
    let left = gh, worked = 0;
    for (let n = 0; left > 1e-9 && n < 8; n++) {
      if (d.rest) {
        const need = Math.max(0, goal - d.e) / heal;
        if (need > left) { d.e += heal * left; break; }
        left -= need; d.e = 1; d.rest = false;
        if (goal < 1) crowed++;
      } else if (work) {
        const go = d.e / drain;
        if (go > left) { d.e -= drain * left; worked += left; break; }
        worked += go; left -= go; d.e = 0; d.rest = true;
      } else break;
    }
    return worked;
  }
  // Com galo, cada volta do descanso é pela metade, e isso sobe a parte do tempo em que ela trabalha.
  const upFrac = (b, r) => RAR[r].tire / (RAR[r].tire + restMin(b) * restGoal());
  const zoneRate = () => (S.farmer ? CFG.workerGrow : 1);
  // Preços em $NUGGET, fixos: quem tem granja maior paga a mesma coisa e sobra mais.
  // A galinha grátis do começo não bota e não funde; o que ela produz só sai da caixa depois da primeira compra em SOL.
  const paid = () => S.invested > 0;
  const layers = (list) => list.filter((h) => !(h.d || h).free);
  const duckPrice = () => CFG.duckNug;
  const driverPrice = () => CFG.driverNug;
  const cleanerPrice = () => CFG.cleanerNug;
  const seedPrice = (id) => CFG.seeds[id].nug;
  const rushPrice = (i) => (S.choc[i] ? Math.max(1, Math.ceil(S.choc[i].left)) * CFG.rushNug : 0);
  // o motorista não espera a caixa grande encher: entrega a cada 4 h de produção, na faixa de frete mais barata
  const driverTop = () => Math.min(cap(), Math.max(500, gross() * CFG.driverAt));
  // Frete por faixa: até 4 h de produção paga 10%; o que passa disso paga mais. É o preço de ficar muito tempo longe.
  function freight(v, extra) {
    const hr = gross();
    let burn = 0, rest = v, from = 0, pct = CFG.collectBurn;
    for (const [h, p] of CFG.freight) {
      if (rest <= 0) break;
      const take = hr > 0 ? Math.min(rest, (h - from) * hr) : rest;
      burn += take * p; rest -= take; from = h; pct = p;
    }
    return Math.round(burn + rest * pct + v * (extra || 0));
  }
  const armed = () => S.hunter > 0;
  const perPen = (i) => CFG.slotsPerPen + S.penLv[i] * CFG.slotStep;
  // Cabem as galinhas dos celeiros abertos e as do próximo, que é a galinha a mais que começa a obra dele: ela espera, sem produzir, até o celeiro abrir.
  const slots = () => PENS.slice(0, Math.min(S.pens + 1, CFG.maxPens)).reduce((a, p, i) => a + perPen(i), 0);
  const slotsAll = () => PENS.reduce((a, p, i) => a + perPen(i), 0);

  // produção de um celeiro: cai em linha reta de 100% (limpo) até 60% (no piso). O limite da caixa usa a produção nominal.
  const penMult = (i) => 1 - (1 - CFG.dirtFloor) * S.dirt[i];
  const isDirty = (i) => S.dirt[i] > CFG.dirtShow;

  // Rendimento: o que uma galinha entrega por hora trabalhando, no abatedouro atual e já sem o frete.
  const perHourTxt = (h) => '+' + fmt(h.p * 60 * goldK(h.r) * abatMult() * coopK(h.pen) * (1 - CFG.collectBurn));
  const rangeTxt = (r) => RAR[r].min + '–' + RAR[r].max;
  const pct = (v) => (v * 100).toLocaleString(LOC, { maximumFractionDigits: 2 }) + '%';

  // Chance de a próxima raposa escolher cada celeiro: proporcional ao tamanho do caminho, só entre celeiros com galinha.
  function risks() {
    const w = PENS.map((p, i) => (i < S.pens && countIn(i) ? p.len : 0));
    const tot = w.reduce((a, b) => a + b, 0) || 1;
    return w.map((v) => v / tot);
  }
  // Risco de um celeiro se a galinha nova for para ele: conta os ocupados pelas outras, mais esse.
  const riskIf = (i, hen) => {
    const on = (j) => j === i || S.hens.some((h) => h !== hen && h.pen === j);
    return PENS[i].len / PENS.slice(0, S.pens).reduce((a, p, j) => a + (on(j) ? p.len : 0), 0);
  };
  // Galinha nova entra no primeiro celeiro com vaga, mesmo que ainda não tenha aberto; escolher o mais seguro é com o jogador.
  const freePen = () => { for (let i = 0; i < CFG.maxPens; i++) if (countIn(i) < perPen(i)) return i; return -1; };

  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function foxRoute() {
    const rk = risks();
    let x = Math.random(), route = rk.findIndex((r) => r > 0);
    for (let i = 0; i < rk.length; i++) { x -= rk[i]; if (x <= 0 && rk[i] > 0) { route = i; break; } }
    return route;
  }

  // Resumo do tempo fora: soma até o jogador voltar a olhar, para virar um aviso só.
  const fora = { made: 0, laid: 0, lost: 0, ducks: 0, driven: 0, shot: 0, picked: 0, built: 0, stolen: [] };
  function foraTxt() {
    const bits = [];
    if (fora.made >= 1) bits.push('+' + fmt(fora.made) + ' ' + t('na caixa'));
    if (fora.driven >= 1) bits.push(t('entregues') + ' +' + fmt(fora.driven));
    if (fora.laid) bits.push(t('{n} ovos', { n: fora.laid }));
    if (fora.lost >= 1) bits.push(t('raposa') + ' -' + fmt(fora.lost));
    if (fora.ducks) bits.push(t('patos usados') + ': ' + fora.ducks);
    if (fora.stolen.length) bits.push(t('ladrão levou') + ': ' + fora.stolen.join(', '));
    if (fora.shot) bits.push(t('ladrões espantados') + ': ' + fora.shot);
    if (fora.picked) bits.push(t('colheitas') + ': ' + fora.picked);
    if (fora.built) bits.push(t('celeiro pronto'));
    let text = bits.length ? '<b>' + t('Enquanto você estava fora') + '</b> ' + bits.join(' · ') : '';
    if (text && S.vault + W.inflightV >= cap() - 0.5) text += ' · ' + t('Caixa cheia');
    return text;
  }
  function tellFora(show) {
    const text = foraTxt();
    for (const k in fora) fora[k] = Array.isArray(fora[k]) ? [] : 0;
    if (show && text) toast(text, 'sum', 9000);
  }
  // Tempo com a aba fechada ou escondida: simula em fatias, porque cansaço, sujeira, raposa, ladrão e horta mudam no meio do caminho.
  // Devolve o resumo; com announce, mostra ao jogador tudo o que somou até aqui.
  function catchUp(realSec, announce) {
    let left = realSec * S.speed / 3600;
    if (!(left > 0)) return null;
    const hours = left, top = cap();
    const fx = W.fox, live = foxEats(fx);                    // raposa que já comia quando a aba saiu de cena continua lá
    let route = live ? fx.route : -1, foxLeft = live ? fx.left : 0;
    let made = 0, lost = 0, eggAcc = 0, gifts = 0, ducks = 0;
    while (left > 1e-9) {
      const h = Math.min(left, Math.max(0.1, Math.min(1, left / 3000)));
      left -= h;
      thiefClock(h, true);
      for (const c of S.choc) if (c && c.left > 0) c.left = Math.max(0, c.left - h);
      hortaStep(h, true);
      buildStep(h, true);
      const drove = S.driver > 0, swept = S.cleaner > 0;
      S.driver = Math.max(0, S.driver - h); S.cleaner = Math.max(0, S.cleaner - h); S.rooster = Math.max(0, S.rooster - h);
      foxLeft -= h;
      if (swept) S.dirt.fill(0);
      else for (let i = 0; i < S.pens; i++) if (countIn(i)) S.dirt[i] = Math.min(1, S.dirt[i] + h / CFG.dirtHours);
      // só vem raposa com caixa com vaga; o caçador atira primeiro, sem ele vai um pato, e sem pato ela come
      const room = S.vault + W.inflightV < top - 0.5;
      if (foxLeft <= 0 && S.hens.length && room) {
        S.nextFox -= h;
        if (S.nextFox <= 0) {
          S.foxes++; S.nextFox = expRand(CFG.foxEvery);
          if (!armed()) { if (S.ducks > 0) { S.ducks--; ducks++; } else { route = foxRoute(); foxLeft = CFG.foxStay; } }
        }
      }
      // pintinhos de cada celeiro nesta fatia, só nas horas em que cada galinha trabalhou, até o que a esteira leva
      const chick = [0, 0, 0, 0], val = [0, 0, 0, 0];
      for (const d of S.hens) { if (d.pen >= S.pens) continue; const c = d.p * 60 * tireHen(d, h, room) * penMult(d.pen); chick[d.pen] += c; val[d.pen] += c * goldK(d.r); }
      const mul = boost() * abatMult();
      let g = 0, eat = 0;
      for (let i = 0; i < PENS.length; i++) {
        if (!chick[i]) continue;
        const y = val[i] * Math.min(1, beltCap(i) * h / chick[i]) * mul * coopK(i);
        if (foxLeft > 0 && i === route) eat += y; else g += y;
      }
      const k = g + eat > 0 ? Math.min(1, Math.max(0, top - S.vault - W.inflightV) / (g + eat)) : 0;
      S.vault += g * k; made += g * k; lost += eat * k;
      // ovos só nas horas em que produziram: com a caixa cheia elas param de botar
      eggAcc += layers(S.hens.filter((d) => d.pen < S.pens)).length * h * k / CFG.eggEvery;
      if (S.eggGift > 0) { S.firstEgg -= h * k; if (S.firstEgg <= 0) { nextGift(); gifts++; } }
      if (drove && paid() && S.vault >= driverTop() - 0.5) fora.driven += deliver(true).net;
    }
    crowed = 0;
    S.eaten += lost;
    if (ducks) S.tutSeen.baited = 1;
    if (live && W.fox === fx) fx.left = Math.max(0, foxLeft);
    syncHens();
    let laid = 0;
    for (let n = gifts + Math.floor(eggAcc) + (Math.random() < eggAcc % 1 ? 1 : 0); n > 0 && S.eggs.length < CFG.nestMax && layers(W.hens).length; n--) {
      layEgg(pick(layers(W.hens)), true); laid++;
    }
    fora.made += made; fora.laid += laid; fora.lost += lost; fora.ducks += ducks;
    const info = { hours, made, laid, lost, ducks, text: foraTxt() };
    if (announce) tellFora(true);
    return info;
  }

  // ---------- horta, caminhão, ladrão e passarinhos: o mesmo passo serve à tela (avisa) e ao tempo fora (quiet, soma no resumo)

  function hortaStep(gh, quiet) {
    S.zones.forEach((z, i) => {
      z.feed = Math.max(0, z.feed - gh);
      if (z.seed && z.left > 0) {
        z.left = Math.max(0, z.left - gh * zoneRate(z));
        if (!z.left && !quiet) {
          emit('plotReady', { zone: i });
          if (!S.farmer) toast('<b>' + t('Horta pronta') + '</b>');
        }
      }
      // o fazendeiro colhe e planta de novo a mesma semente, se o saldo pagar
      if (S.farmer) {
        if (z.seed && z.left <= 0) harvestZone(i, quiet, true);
        if (!z.seed && z.last && S.nug >= seedPrice(z.last)) plantZone(i, z.last, quiet, true);
      }
    });
    S.nextBird -= gh;
    if (S.nextBird <= 0) { S.nextBird = expRand(CFG.birdEvery); birdsCome(quiet); }
  }
  // Bando de passarinhos num canteiro crescendo: atrasa a planta. Com fazendeiro, eles nem pousam.
  function birdsCome(quiet) {
    const grow = S.zones.map((z, i) => i).filter((i) => S.zones[i].seed && S.zones[i].left > 0);
    if (S.farmer || !grow.length) return;
    const i = pick(grow), z = S.zones[i];
    S.birdsIn++; z.left = Math.min(CFG.seeds[z.seed].grow, z.left + CFG.birdSet);
    if (quiet) return;
    W.birds = { zone: i, t: 0 };
    emit('birds', { zone: i });
    toast('<b>' + t('Passarinhos na horta!') + '</b> +' + durTxt(CFG.birdSet), 'bad');
  }
  // Obra: cada galinha nova conta, e a que passa da conta do próximo celeiro começa a obra dele. O celeiro com taxa em SOL não tem obra: abre na hora que o jogador pagar.
  function coopCheck() {
    const i = S.pens, c = COOPS[i];
    if (!c || !c.hours || S.build || S.got < c.hens) return;
    S.build = W.build = { pen: i, left: c.hours, total: c.hours };
    emit('build', { pen: i });
    toast('<b>' + t('Celeiro {n} em obra', { n: i + 1 }) + '</b> ' + durTxt(c.hours));
  }
  function buildStep(gh, quiet) {
    if (!S.build) return;
    S.build.left -= gh;
    if (S.build.left <= 0) buildDone(quiet);
  }
  function buildDone(quiet) {
    const i = S.build.pen;
    S.build = W.build = null;
    S.pens = W.pens = i + 1;
    syncHens();
    coopCheck();
    if (quiet) { fora.built++; return; }
    emit('pen', { i });
    toast('<b>' + t('Celeiro {n} pronto', { n: i + 1 }) + '</b>');
    save();
  }
  function rushBuild() {
    if (busy || !S.build || !spend(COOPS[S.build.pen].rush)) return;
    buildDone();
    celebrate();
    ui();
  }
  // De tempos em tempos, com granja grande: o caçador atira; sem ele, o ladrão leva uma galinha do celeiro que ele escolher (mesmo risco da raposa).
  const thiefOn = () => S.pens >= CFG.thiefPens && S.hens.length >= CFG.thiefMin;
  function thiefClock(gh, quiet) {
    if (!thiefOn() || (!quiet && W.thief)) return;
    S.nextThief -= gh;
    if (S.nextThief > 0) return;
    S.nextThief = expRand(CFG.thiefEvery);
    S.thieves++;
    if (!quiet) { spawnThief(); return; }
    if (armed()) { S.thiefShot++; fora.shot++; return; }
    const d = stealHen();
    if (d) fora.stolen.push(t(RAR[d.r].nome));
  }
  function stealHen() {
    const pen = foxRoute(), list = S.hens.filter((h) => h.pen === pen);
    if (!list.length) return null;
    const d = pick(list);
    S.hens.splice(S.hens.indexOf(d), 1); S.stolen++;
    syncHens();
    return d;
  }

  // Ovo cai no chão do celeiro, perto da galinha, e fica lá até ser vendido ou ir pra chocadeira.
  function layEgg(h, quiet) {
    if (S.eggs.length >= CFG.nestMax) return;
    const p = PENS[h.pen];
    const x = Math.max(p.x + 1.2, Math.min(p.x + p.w - 1.2, h.x + rnd(-0.6, 0.6)));
    const z = Math.max(p.z + 1.2, Math.min(p.z + p.d - 1.2, h.z + rnd(0.2, 0.9)));
    const egg = { id: S.eggIds++, pen: h.pen, x, z };
    S.eggs.push(egg);
    if (quiet) return;
    h.layAnim = 1;
    emit('egg', { egg, hen: h });
    save();
  }
  // Ovos de presente do começo: firstEgg conta as horas de produção até o próximo.
  function nextGift() { S.eggGift--; S.firstEgg = S.eggGift > 0 ? CFG.secondEgg : -1; }

  // ---------- simulação

  function henAI(h, dt, full) {
    h.phase += dt;
    h.layAnim = Math.max(0, h.layAnim - dt * 3);
    if (full) { h.state = 'sit'; return; }
    // cansada: vai até a palha na beira do terreiro, longe da casinha para ela não esconder quem dorme, e dorme
    if (h.d && h.d.rest) {
      if (!h.spot) { const p = PENS[h.pen]; h.spot = [rnd(p.x + 8, p.x + p.w - 1.8), p.gate === 'top' ? rnd(p.z + 1.5, p.z + 4) : rnd(p.z + p.d - 4, p.z + p.d - 1.5)]; }
      const dx = h.spot[0] - h.x, dz = h.spot[1] - h.z, d = Math.hypot(dx, dz);
      if (d < 0.25) { h.state = 'sit'; return; }
      h.state = 'walk';
      h.x += dx / d * Math.min(d, 2.4 * dt); h.z += dz / d * Math.min(d, 2.4 * dt);
      if (Math.abs(dx) > 0.05) h.dir = dx > 0 ? 1 : -1;
      return;
    }
    h.spot = null;
    if (h.state === 'sit') { h.state = 'idle'; h.st = Math.random(); }
    h.st -= dt;
    if (h.state === 'walk') {
      const dx = h.tx - h.x, dz = h.tz - h.z, d = Math.hypot(dx, dz);
      if (d < 0.25) { h.state = Math.random() < 0.6 ? 'peck' : 'idle'; h.st = rnd(0.8, 2.6); return; }
      const sp = 3.2 * dt;
      h.x += dx / d * sp; h.z += dz / d * sp;
      if (Math.abs(dx) > 0.05) h.dir = dx > 0 ? 1 : -1;
    } else if (h.st <= 0) {
      [h.tx, h.tz] = spotIn(PENS[h.pen]);
      h.state = 'walk';
    }
  }

  // Pintinho na esteira: vale n (o dourado, 10 a mais) × 4 × bônus da horta × abatedouro. Anda na velocidade da esteira.
  function spawnChick(h, n) {
    const p = PENS[h.pen];
    const gold = RAR[h.r].gold > 0 && Math.random() < 1 - Math.pow(1 - RAR[h.r].gold, n);
    const v = (n + (gold ? CFG.goldMult - 1 : 0)) * boost() * abatMult();
    const jx = rnd(-1.5, 1.5), jz = rnd(-1.5, 1.5);   // o mesmo desvio em todos os pontos mantém o pintinho na sua faixa da estrada
    const gate = p.gate === 'right' ? [p.gx, p.gz + jz] : [p.gx + jx, p.gz];
    W.chicks.push({
      id: ++chickId, r: h.r, pen: h.pen, gold, n, v, x: h.x, z: h.z, i: 0, sp: BELTS[h.pen].speed, ph: Math.random() * 6, dir: 1,
      wp: [gate].concat(p.route.map(([x, z], k) => k === p.route.length - 1 ? [x + jx * 0.3, z + jz * 0.3] : [x + jx, z + jz])),
    });
    W.inflightV += v;
    h.layAnim = 1;
  }

  function moveChicks(dt) {
    const fx = W.fox, eating = foxEats(fx);
    for (let i = W.chicks.length - 1; i >= 0; i--) {
      const c = W.chicks[i];
      c.ph += dt * 16;
      let step = c.sp * dt;
      while (step > 0 && c.i < c.wp.length) {
        const [tx, tz] = c.wp[c.i], dx = tx - c.x, dz = tz - c.z, d = Math.hypot(dx, dz);
        if (d <= step) { c.x = tx; c.z = tz; c.i++; step -= d; }
        else { c.x += dx / d * step; c.z += dz / d * step; if (Math.abs(dx) > 0.01) c.dir = dx > 0 ? 1 : -1; step = 0; }
      }
      if (eating && c.pen === fx.route && c.i >= 1 && Math.hypot(c.x - fx.x, c.z - fx.z) < 3.4) {
        W.chicks.splice(i, 1); W.inflightV -= c.v;
        S.eaten += c.v; lossAcc += c.v; fx.eaten += c.v;
        emit('eat', c);
        continue;
      }
      if (c.i >= c.wp.length) {
        W.chicks.splice(i, 1); W.inflightV -= c.v;
        S.vault += c.v; incomeAcc += c.v;
        emit('arrive', c);
        if (c.gold) { emit('gold', c); goldNote(c.v); }
      }
    }
  }

  // Pintinho dourado: o brilho e o som saem a cada um; o aviso junta os que chegam em sequência, um a cada goldGap segundos.
  let goldSum = 0, goldN = 0, goldAt = -1e9;
  function goldNote(v) {
    goldSum += v; goldN++;
    if (W.time - goldAt < CFG.goldGap) return;
    goldAt = W.time;
    toast('<b>' + t('Pintinho dourado!') + '</b> +' + fmt(goldSum), 'gold');
    goldSum = 0; goldN = 0;
  }

  function moveTo(o, x, z, sp, dt) {
    const dx = x - o.x, dz = z - o.z, d = Math.hypot(dx, dz);
    if (d <= sp * dt) { o.x = x; o.z = z; return true; }
    o.x += dx / d * sp * dt; o.z += dz / d * sp * dt; o.dir = dx >= 0 ? 1 : -1;
    return false;
  }
  // Com caçador a raposa só come depois do tiro: "o caçador atira primeiro".
  const foxEats = (fx) => !!fx && fx.state === 'eat' && (!fx.armed || fx.shot);
  // Raposa em eat só é perda de verdade se houver pintinho passando naquele caminho.
  const foxBiting = () => foxEats(W.fox) && W.chicks.some((c) => c.pen === W.fox.route);
  // O pato só sai com pintinho em risco: caixa com vaga. Senão fica no açude até isso mudar. wait: no tutorial, ele espera a raposa comer um pouco.
  const duckGo = (fx) => foxEats(fx) && S.ducks > 0 && !W.full && !fx.wait;
  // Raposa que comia quando a página fechou volta ao mesmo lugar, com o tempo que faltava.
  function foxBack(e) {
    if (!e || !(e.left > 0) || !PENS[e.route] || e.route >= S.pens) return;
    const [x, z] = PENS[e.route].fox;
    W.fox = { state: 'eat', route: e.route, x, z, t: 0, left: e.left, eaten: e.eaten || 0, ph: 0, dir: -1, armed: false, shot: true, aimed: true, dies: false };
  }
  function spawnFox() {
    // sorteia o celeiro pelo risco do caminho (caminho longo, mais perto da mata, atrai mais)
    const route = foxRoute();
    if (route < 0) return;
    S.foxes++;
    const arm = armed();
    const fx = W.fox = { state: 'come', route, x: MAP.foxIn[0], z: MAP.foxIn[1], t: 0, left: CFG.foxStay, eaten: 0, ph: 0, dir: -1, armed: arm, shot: false, aimed: false,
      dies: arm && Math.random() < CFG.hunters[S.hunter].kill };
    emit('fox', { state: 'come', fox: fx });
  }
  // Um pato parte do açude até a raposa: na chegada, depois de um tiro errado ou na compra durante o eat.
  function startBait(fx) {
    S.ducks--; W.ducks = S.ducks; S.tutSeen.baited = 1;
    const P = MAP.pond;
    fx.state = 'bait'; fx.t = 0;
    fx.duck = { x: P.x + P.w * 0.8, z: P.z + P.d / 2, dir: 1, ph: 0, run: false };
    emit('fox', { state: 'bait', fox: fx });
    save();
  }
  function foxStep(dt, gh) {
    const fx = W.fox;
    if (!fx) {
      // sem pintinho na estrada (caixa cheia ou galinhas dormindo) a raposa nem aparece
      if (!W.hens.length || W.full) return;
      S.nextFox -= gh;
      if (S.nextFox > 0) return;
      S.nextFox = expRand(CFG.foxEvery);
      spawnFox();
      return;
    }
    fx.t += dt; fx.ph += dt;
    if (fx.state === 'come') {
      const [sx, sz] = PENS[fx.route].fox;
      if (moveTo(fx, sx, sz, 24, dt)) {
        fx.t = 0; fx.dir = -1;
        fx.state = 'eat';
        emit('fox', { state: 'eat', fox: fx });
      }
    }
    if (fx.state === 'bait') {
      // o pato corre até a raposa, grasna e foge para a mata; ela larga os pintinhos e vai atrás
      const d = fx.duck;
      d.ph += dt;
      if (moveTo(d, fx.x - 2.5, fx.z + 0.5, 16, dt)) {
        fx.state = 'lure'; fx.t = 0; d.run = true;
        emit('lure', { fox: fx });
        toast(t('O pato levou a raposa embora.'));
      }
    } else if (fx.state === 'lure') {
      const d = fx.duck;
      if (d) { d.ph += dt; if (moveTo(d, MAP.foxIn[0], MAP.foxIn[1], 21, dt)) fx.duck = null; }
      if (fx.t > 0.35 && moveTo(fx, MAP.foxIn[0], MAP.foxIn[1], 19, dt)) W.fox = null;
    } else if (fx.state === 'eat') {
      fx.left -= gh;
      if (fx.armed && !fx.aimed && fx.t >= 0.2) { fx.aimed = true; emit('aim', { fox: fx }); }
      if (fx.armed && !fx.shot && fx.t >= 1.1) {
        fx.shot = true;
        emit('shoot', { kill: fx.dies, fox: fx });
        if (fx.dies) { fx.state = 'die'; fx.t = 0; toast(t('Raposa abatida.')); save(); return; }
        if (!duckGo(fx)) toast(t('O caçador errou.'), 'bad');
      }
      // sem caçador o pato sai na hora; com caçador ele espera o tiro
      if (duckGo(fx)) { startBait(fx); return; }
      if (fx.left <= 0) {
        fx.state = 'flee'; fx.t = 0;
        emit('fox', { state: 'flee', fox: fx });
        if (fx.eaten >= 1) toast(t('Raposa comeu') + ' <b>' + fmt(fx.eaten) + '</b>', 'bad');
      }
    } else if (fx.state === 'flee') {
      if (moveTo(fx, MAP.foxIn[0], MAP.foxIn[1], 26, dt)) W.fox = null;
    } else if (fx.state === 'die') {
      if (fx.t > 1.4) W.fox = null;
    }
  }

  // Ladrão: sai da mata do oeste até o portão do celeiro sorteado (o mesmo risco da raposa). Com caçador, leva tiro no caminho e foge
  // sem nada; sem caçador, pega uma galinha e some com ela. Pato não adianta: ladrão não corre atrás de pato.
  function spawnThief() {
    const pen = foxRoute();
    if (pen < 0) return;
    const p = PENS[pen], arm = armed();
    const to = p.gate === 'right' ? [p.gx - 1.5, p.gz] : [p.gx, p.gate === 'top' ? p.gz + 1.5 : p.gz - 1.5];
    W.thief = { state: 'come', pen, x: MAP.thiefIn[0], z: MAP.thiefIn[1], t: 0, ph: 0, dir: 1, armed: arm, shot: false, aimed: false, hen: -1, to };
    emit('thief', { state: 'come', thief: W.thief });
    toast('<b>' + t('Ladrão de galinhas!') + '</b>', arm ? '' : 'bad');
  }
  function thiefStep(dt) {
    const th = W.thief;
    if (!th) return;
    th.t += dt; th.ph += dt;
    if (th.state === 'come') {
      if (th.armed && !th.aimed && th.t >= 0.3) { th.aimed = true; emit('aim', { fox: th }); }
      if (th.armed && !th.shot && th.t >= 1.3) {
        th.shot = true; th.state = 'run'; th.t = 0;
        S.thiefShot++;
        emit('shoot', { kill: true, fox: th, thief: true });
        toast(t('O ladrão fugiu.'));
        save();
        return;
      }
      if (moveTo(th, th.to[0], th.to[1], 9, dt)) {
        const list = S.hens.filter((h) => h.pen === th.pen);
        th.state = 'run'; th.t = 0;
        if (!list.length) return;
        const d = pick(list);
        S.hens.splice(S.hens.indexOf(d), 1); S.stolen++;
        th.hen = d.r; th.skin = d.skin;
        syncHens();
        emit('thief', { state: 'grab', thief: th });
        toast('<b>' + t('O ladrão levou uma galinha') + '</b> ' + t(RAR[d.r].nome), 'bad');
        save(); ui();
      }
    } else if (th.state === 'run') {
      if (moveTo(th, MAP.thiefIn[0], MAP.thiefIn[1], th.shot ? 15 : 11, dt)) W.thief = null;
    }
  }

  // Sem galo, a galinha que já descansou a metade volta na hora com o seu toque. Com galo isso acontece sozinho.
  const wakeable = (i) => S.hens.filter((h) => h.pen === i && h.rest && h.e >= CFG.wakeMin);
  function wakeHens(i) {
    const list = wakeable(i);
    if (!list.length) return;
    for (const d of list) { d.e = 1; d.rest = false; }
    emit('wake', { pen: i, by: 'tap' });
    save(); ui();
  }
  function crow() {
    if (!W.rooster) return;
    W.rooster.crow = 1;
    emit('crow', { rooster: W.rooster });
  }
  // Horta, obra, motorista, faxineiro e galo contam o tempo todo.
  function tickServices(gh) {
    hortaStep(gh, false);
    buildStep(gh, false);
    if (S.driver > 0) { S.driver = Math.max(0, S.driver - gh); if (!S.driver) toast(t('O motorista terminou o turno.')); }
    if (S.cleaner > 0) { S.cleaner = Math.max(0, S.cleaner - gh); if (!S.cleaner) toast(t('O faxineiro terminou o turno.')); }
    if (S.rooster > 0) { S.rooster = Math.max(0, S.rooster - gh); if (!S.rooster) { syncHens(); toast(t('O galo terminou o turno.')); } }
  }

  // Limpar é de graça, vale na hora e brilha.
  function cleanPen(i) {
    if (!(S.dirt[i] > 0)) return;
    S.dirt[i] = 0;
    emit('clean', { pen: i });
    if (sheetTab) stars(el.sheetBody, 18);
    save(); ui();
  }

  function step(dt) {
    W.time += dt;
    const gh = dt * S.speed / 3600;
    thiefClock(gh, false);
    tickServices(gh);
    syncClock();
    // só suja celeiro com galinha; com faxineiro, nada suja
    if (S.cleaner > 0) S.dirt.fill(0);
    else for (let i = 0; i < S.pens; i++) if (W.penCount[i]) S.dirt[i] = Math.min(1, S.dirt[i] + gh / CFG.dirtHours);
    const c = cap();
    const full = S.vault + W.inflightV >= c - 0.5;
    if (full !== W.full) { W.full = full; emit(full ? 'full' : 'unfull'); }
    const layable = !full && S.eggs.length < CFG.nestMax;
    if (W.rooster) {
      const r = W.rooster;
      r.phase += dt;
      if (r.crow > 0) r.crow = Math.max(0, r.crow - dt * 0.7);
    }
    // cansaço primeiro: quanto cada galinha trabalhou neste passo; a esteira de cada celeiro leva até o limite dela
    const chick = [0, 0, 0, 0];
    for (const h of W.hens) { h.wk = tireHen(h.d, gh, !full); chick[h.pen] += h.d.p * 60 * h.wk * penMult(h.pen); }
    if (crowed) { crowed = 0; crow(); }
    const belt = chick.map((v, i) => (v > 0 ? Math.min(1, beltCap(i) * gh / v) : 1));
    for (const h of W.hens) {
      henAI(h, dt, full);
      h.zz = !!h.d.rest;
      if (layable && !h.d.free && Math.random() < gh / CFG.eggEvery) layEgg(h);
      if (h.wk) h.pending += h.d.p * 60 * h.wk * penMult(h.pen) * belt[h.pen];
    }
    // portão de cada celeiro: um pintinho por vez, a cada CHICK_GAP de esteira; vai o da galinha que mais juntou, levando tudo o que ela juntou
    for (let i = 0; i < S.pens; i++) {
      if ((W.gateT[i] -= dt) > 0 || W.chicks.length >= MAX_CHICKS) continue;
      let best = null;
      for (const h of W.hens) if (h.pen === i && h.pending >= 1 && (!best || h.pending > best.pending)) best = h;
      if (!best) continue;
      const n = Math.floor(best.pending);
      best.pending -= n;
      spawnChick(best, n);
      W.gateT[i] = CHICK_GAP / BELTS[i].speed;
    }
    if (layable && S.eggGift > 0 && layers(W.hens).length) {
      S.firstEgg -= gh;
      if (S.firstEgg <= 0) { nextGift(); layEgg(pick(layers(W.hens))); }
    }
    S.choc.forEach((k, i) => {
      if (!k || k.left <= 0) return;
      k.left -= gh;
      if (k.left <= 0) { k.left = 0; emit('chocReady', { pen: i }); }
    });
    W.eggs = S.eggs;
    moveChicks(dt);
    if (S.driver > 0 && paid() && S.vault >= driverTop() - 0.5) driverRun();
    foxStep(dt, gh);
    thiefStep(dt);
    if (W.birds && (W.birds.t += dt) > 5) W.birds = null;
    popClock += dt;
    if (popClock > 0.7) {
      popClock = 0;
      if (incomeAcc >= 1) { emit('income', { v: incomeAcc }); incomeAcc = 0; }
      if (lossAcc >= 1) { emit('loss', { v: lossAcc }); lossAcc = 0; }
    }
    W.fill = Math.min(1, (S.vault + W.inflightV) / c);
    syncPenUi();
  }

  // ---------- ações do jogador

  // O caminhão leva a caixa inteira e a venda é na hora: o saldo sobe no toque, menos o frete, que é queimado. Com o motorista o frete sobe.
  function deliver(driver) {
    const v = Math.floor(S.vault), burn = freight(v, driver ? CFG.driverExtra : 0), net = v - burn;
    S.vault -= v;
    S.nug += net; S.burned += burn; S.earned += net;
    return { v, net, burn };
  }
  function collect() {
    if (busy) return;
    const fill = (S.vault + W.inflightV) / cap();
    if (Math.floor(S.vault) < 1) { toast(t('Caixa vazia')); emit('error'); return; }
    if (!paid()) { toast(t('Sai na 1ª compra em SOL')); emit('error'); return; }
    const { net, burn } = deliver(false);
    emit('collect', { net, burn, frac: fill });
    emit('delivered', { net });
    bump();
    toast('<b>+' + fmt(net) + '</b>');
    save(); ui();
  }
  function driverRun() {
    if (Math.floor(S.vault) < 1) return;
    const fill = (S.vault + W.inflightV) / cap(), { net } = deliver(true);
    emit('collect', { net, frac: fill });
    emit('delivered', { net });
    bump();
    save();
  }
  function buyVault() {
    if (busy) return;
    const lv = S.vaultLv + 1;
    if (lv >= CFG.vaultLv.length) return;
    if (!spend(CFG.vaultNug[lv])) return;
    S.vaultLv = W.vaultLv = lv;
    emit('vault', { lv });
    celebrate();
    save(); ui();
  }
  function hireDriver() {
    if (busy || !spend(driverPrice())) return;
    S.driver = Math.min(S.driver + CFG.driverHours, CFG.driverHours * 3);
    save(); ui();
  }
  function hireCleaner() {
    if (busy || !spend(cleanerPrice())) return;
    S.cleaner = Math.min(S.cleaner + CFG.cleanerHours, CFG.cleanerHours * 3);
    for (let i = 0; i < S.pens; i++) if (S.dirt[i] > 0) { S.dirt[i] = 0; emit('clean', { pen: i }); }
    save(); ui();
  }

  // O celeiro com taxa em SOL: liberado pelas galinhas, abre na hora em que o jogador paga.
  function buyPen() {
    const i = S.pens, c = COOPS[i];
    if (busy || !c || !c.sol || S.got < c.hens) return;
    openTx({ action: t('Celeiro') + ' ' + (i + 1), sol: c.sol, onDone: () => {
      S.pens++; S.invested += c.sol; W.pens = S.pens;
      syncHens();
      emit('pen', { i });
      celebrate();
      busy = false; save(); ui();
    } });
  }

  // Raposa ou ladrão em cena que ainda não levou tiro: o caçador atira.
  function armFox() {
    const th = W.thief;
    if (th && th.state === 'come' && !th.armed && armed()) { th.armed = true; th.t = 0; th.aimed = false; }
    const fx = W.fox;
    if (!fx || fx.shot && fx.armed || !armed() || !(fx.state === 'come' || fx.state === 'eat')) return;
    fx.armed = true; fx.shot = false; fx.dies = Math.random() < CFG.hunters[S.hunter].kill; fx.t = 0; fx.aimed = false;
  }
  function buyHunter(level) {
    if (busy || S.hunter >= level) return;
    const h = CFG.hunters[level];
    openTx({ action: t(h.nome), sol: h.sol, onDone: () => {
      S.hunter = level; S.invested += h.sol; W.hunter = level;
      armFox();
      emit('hunter', { level });
      celebrate();
      busy = false; save(); ui();
    } });
  }

  // Baratinho e por dia, como os outros serviços: dá para juntar até 3 dias.
  function buyRooster() {
    if (busy || S.rooster > CFG.roosterHours * 2 || !spend(CFG.roosterNug)) return;
    S.rooster += CFG.roosterHours;
    syncHens();
    emit('rooster');
    crow();
    celebrate();
    save(); ui();
  }
  // Tudo o que se paga em $NUGGET é queimado. pay é o gasto automático (trabalhador replantando): sem aviso.
  function pay(v) {
    if (S.nug < v) return false;
    S.nug -= v; S.burned += v; S.earned -= v;
    return true;
  }
  function spend(v) {
    if (!pay(v)) { toast(t('Faltam') + ' ' + fmt(v - S.nug), 'bad'); emit('error'); return false; }
    bump();
    return true;
  }
  function buyDuck() {
    if (busy || S.ducks >= CFG.duckMax) return;
    if (!spend(duckPrice())) return;
    S.ducks++; W.ducks = S.ducks;
    emit('duck', { n: S.ducks });
    // raposa comendo: o pato novo sai na hora (com caçador, espera o tiro)
    const fx = W.fox;
    if (duckGo(fx)) startBait(fx);
    save(); ui();
  }

  // Fusão: de 2 a 10 galinhas iguais + taxa viram uma da raridade seguinte, com produção sorteada. Entram as de menor produção.
  // Quanto mais galinhas, maior a chance, mas cada uma soma menos que a anterior. Falhou: some uma delas, ao acaso, e a taxa.
  const fuseChance = (r, n) => CFG.fuseCap * (1 - Math.pow(1 - CFG.fusion[r].q, n - 1));
  const fuseN = [3, 3, 3, 3];                               // quantas o jogador escolheu pôr em cada fusão (só na tela)
  function fuse(r) {
    const f = CFG.fusion[r], n = fuseN[r];
    if (busy || !f) return;
    const same = layers(S.hens).filter((h) => h.r === r).sort((a, b) => a.p - b.p);
    if (same.length < n) { emit('error'); return; }
    if (!spend(f.nug)) return;
    const used = same.slice(0, n), chance = fuseChance(r, n), fuse = { from: r, n, chance, fee: f.nug };
    H.closeSheet();
    busy = true;
    if (Math.random() >= chance) {
      const lost = pick(used);
      S.hens.splice(S.hens.indexOf(lost), 1); S.fuseFail++;
      syncHens(); save();
      startReveal(r, 'fuse', Object.assign(fuse, { lost }));
      return;
    }
    for (const h of used) S.hens.splice(S.hens.indexOf(h), 1);
    S.fused++;
    S.hens.push(newHen(r + 1, Math.max(0, freePen())));
    syncHens(); save();
    startReveal(r + 1, 'fuse', fuse);
  }
  // Fusão que falhou: fecha a revelação e mostra a granja de novo, com uma galinha a menos.
  function closeFail() {
    if (rev.multi && rev.hatched) { closeMulti(); return; }
    if (!rev.fail || !rev.hatched) return;
    el.ovReveal.hidden = true; el.ovReveal.classList.remove('failed');
    rev.on = false; busy = false;
    save(); ui();
  }
  const setFuseN = (r, d) => { fuseN[r] = Math.max(CFG.fuseMin, Math.min(CFG.fuseMax, fuseN[r] + d)); renderPanel(); };
  function buySlots(i) {
    if (busy || S.pens < CFG.maxPens) return;
    const price = CFG.slotNug[S.penLv[i]];
    if (price == null) return;
    if (!spend(price)) return;
    S.penLv[i]++;
    syncHens();
    celebrate();
    save(); ui();
  }

  // Melhoria paga em $NUGGET (queima): o abatedouro, um nível por vez.
  const num = (v) => v.toLocaleString(LOC, { maximumFractionDigits: 2 });
  function buyAbat() {
    if (busy) return;
    const a = ABATS[S.abat + 1];
    if (!a || !spend(a.nug)) return;
    S.abat++;
    emit('abat', { lv: S.abat });
    celebrate();
    save(); ui();
  }
  function hireWorker() {
    if (busy || S.farmer || !spend(CFG.workerNug)) return;
    S.farmer = W.farmer = true;
    emit('worker');
    celebrate();
    save(); ui();
  }

  // Horta: plantar custa a semente; colher soma as horas de bônus naquele canteiro. O fazendeiro faz os dois sozinho (auto).
  function plantZone(i, id, quiet, auto) {
    const sd = CFG.seeds[id], z = S.zones[i];
    if (!sd || !z || z.seed || (!auto && busy)) return;
    if (auto ? !pay(seedPrice(id)) : !spend(seedPrice(id))) return;
    z.seed = id; z.left = sd.grow; z.last = id;
    if (quiet) return;
    emit('plant', { zone: i, seed: id });
    if (auto) return;
    save(); ui();
  }
  function harvestZone(i, quiet, auto) {
    const z = S.zones[i];
    if (!z || !z.seed || z.left > 0 || (!auto && busy)) return;
    const id = z.seed, sd = CFG.seeds[id];
    z.seed = null;
    z.feed = Math.min(CFG.buffMax, z.feed + sd.hours);
    z.boost = sd.boost;
    if (quiet) { fora.picked++; return; }
    emit('harvest', { zone: i, seed: id });
    if (!auto) toast('<b>+' + Math.round(sd.boost * 100) + '%</b> ' + durTxt(z.feed));
    save();
    if (!auto) ui();
  }
  const harvestAll = () => S.zones.forEach((z, i) => { if (z.seed && z.left <= 0) harvestZone(i); });
  function rushChoc(i) {
    const k = S.choc[i];
    if (busy || !k || k.left <= 0) return;
    if (!spend(rushPrice(i))) return;
    k.left = 0.0001;                                        // o próximo passo dispara chocReady pelo caminho normal
    save(); ui();
  }

  // Comprar 1, 5 ou 10 ovos de uma vez, sem desconto: o preço é o de um ovo vezes n. Vários abrem juntos numa tela só.
  const mintCost = (n) => Math.round(CFG.mintSol * n * 1e6) / 1e6;
  function mint(n) {
    n = n || 1;
    if (busy) return;
    const free = slots() - S.hens.length;
    if (free < n) {
      emit('error');
      H.openSheet('barn');
      toast(t('Sem vaga'), 'bad');
      return;
    }
    const sol = mintCost(n);
    openTx({ action: n > 1 ? t('{n} ovos', { n }) : t('1 ovo'), sol, odds: true, onDone: () => {
      const got = [];
      for (let i = 0; i < n; i++) { const h = newHen(roll(), freePen()); S.hens.push(h); got.push(h); }
      S.invested += sol; S.got += n;
      coopCheck();
      emit('buy');
      save();
      if (n > 1) startMulti(got); else startReveal(got[0].r);
    } });
  }

  // Carteira simulada: ovo, celeiro e caçador passam por aqui.
  function openTx(tx) {
    if (S.sol < tx.sol + CFG.netFee) { toast(t('Sem SOL'), 'bad'); emit('error'); return; }
    busy = true; pendingTx = tx;
    el.wAction.textContent = tx.action;
    el.wValue.textContent = fmtSol(tx.sol) + ' SOL';
    el.wOdds.hidden = !tx.odds;
    el.wBtns.hidden = false; el.wBusy.hidden = true;
    el.ovWallet.hidden = false;
    modal();
    el.wYes.focus();
  }
  function rejectTx() {
    el.ovWallet.hidden = true; busy = false; pendingTx = null;
    modal();
  }
  // Com carteira ou revelação abertas, o resto da página sai do alcance do Tab.
  const modal = () => {
    const on = !el.ovWallet.hidden || !el.ovReveal.hidden, g = guide.on;
    el.hud.inert = on || g; el.stage.inert = on; el.dock.inert = on; el.tabs.inert = on || g; el.sheet.inert = g;
    if (!on && held.length) toast(held.splice(0).slice(-3).join(' '), 'sum', 7000);
  };
  function approveTx() {
    const tx = pendingTx;
    if (!tx) return;
    el.wBtns.hidden = true; el.wBusy.hidden = false;
    el.wBusy.classList.remove('ok');
    el.wBusyTxt.textContent = t('Simulando envio…');
    setTimeout(() => {
      el.wBusy.classList.add('ok');
      el.wBusyTxt.textContent = t('Confirmada') + ' · ' + fakeSig();
      // cobrança e entrega no mesmo passo: fechar a página aqui no meio não paga sem levar. O SOL se divide entre a pool e o time.
      setTimeout(() => {
        S.sol -= tx.sol + CFG.netFee; S.pool += tx.sol * CFG.poolShare; S.team += tx.sol * (1 - CFG.poolShare);
        el.ovWallet.hidden = true; pendingTx = null; tx.onDone(); ui();
      }, 700);
    }, 1100);
  }
  function roll() {
    let x = Math.random() * 100;
    for (let i = 0; i < RAR.length; i++) { x -= RAR[i].chance; if (x < 0) return i; }
    return 0;
  }

  function fakeSig() {
    const a = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const p = (n) => Array.from({ length: n }, () => a[Math.floor(Math.random() * a.length)]).join('');
    return p(4) + '…' + p(4);
  }

  // fuse: a fusão em curso (de qual raridade, quantas, a chance e, se falhou, quem se perdeu). Ela tem mais suspense e não dá para pular.
  // multi: vários ovos abrindo juntos, cada um no seu tempo (at), da raridade menor para a maior.
  const rev = { on: false, t: 0, r: 0, hatched: false, src: 'mint', fuse: null, fail: null, multi: null, skip: false };
  const revDur = () => (rev.multi ? rev.multi[rev.multi.length - 1].at + 0.5 : rev.src === 'fuse' ? 3.4 : 1.9);
  function startReveal(r, src, fuse) {
    Object.assign(rev, { on: true, t: 0, r, hatched: false, src: src || 'mint', fuse: fuse || null, fail: fuse && fuse.lost ? fuse.lost : null, multi: null, skip: false });
    el.ovReveal.classList.remove('multi'); el.revGrid.hidden = true;
    el.ovReveal.style.setProperty('--rc', RAR[fuse ? fuse.from : r].cor);
    el.ovReveal.dataset.r = RAR[r].id;
    el.ovReveal.classList.remove('hatched', 'failed');
    el.ovReveal.classList.toggle('fusing', !!fuse);
    el.revInfo.hidden = true;
    el.revHint.hidden = false;
    el.revHint.textContent = fuse ? t('Fundindo') + ' · ' + pct(fuse.chance) : t('Abrindo o ovo…') + (S.tutSeen.reveal ? ' ' + t('toque para pular') : '');
    el.ovReveal.hidden = false;
    modal();
    emit('reveal', { r, stage: 'start' });
  }
  // A primeira abertura passa inteira; da segunda em diante, tocar pula para a galinha.
  const skipReveal = () => { if (rev.on && !rev.hatched && S.tutSeen.reveal && !rev.fuse) { rev.skip = true; rev.t = Math.max(rev.t, revDur()); } };
  // Vários ovos: uma grade de ovos tremendo que racham um por um; o melhor fica por último.
  function startMulti(hens) {
    const list = hens.slice().sort((a, b) => a.r - b.r || a.p - b.p), gap = list.length > 5 ? 0.32 : 0.5;
    const best = list[list.length - 1].r;
    Object.assign(rev, { on: true, t: 0, r: best, hatched: false, src: 'mint', fuse: null, fail: null, skip: false,
      multi: list.map((h, i) => ({ h, at: 1.5 + i * gap, out: false })) });
    el.ovReveal.style.setProperty('--rc', RAR[0].cor);
    el.ovReveal.dataset.r = RAR[best].id;
    el.ovReveal.classList.remove('hatched', 'failed', 'fusing');
    el.ovReveal.classList.add('multi');
    el.revGrid.classList.toggle('ten', list.length > 5);
    el.revGrid.innerHTML = rev.multi.map((m) => '<div class="egg-cell" style="--d:' + m.at + 's;--c:' + RAR[m.h.r].cor + '"><canvas width="200" height="200"></canvas><span></span></div>').join('');
    rev.multi.forEach((m, i) => { const c = el.revGrid.children[i]; m.el = c; m.ctx = c.querySelector('canvas').getContext('2d'); });
    el.revGrid.hidden = false;
    el.revInfo.hidden = true;
    el.revHint.hidden = false;
    el.revHint.textContent = t('Abrindo o ovo…') + (S.tutSeen.reveal ? ' ' + t('toque para pular') : '');
    el.ovReveal.hidden = false;
    modal();
    emit('reveal', { r: best, stage: 'start' });
  }
  // um ovo da grade racha: mostra a raridade e a produção; com o pulo, só o melhor toca a fanfarra
  function hatchCell(m, last) {
    m.out = true;
    m.el.classList.add('out');
    m.el.querySelector('span').innerHTML = '<b>' + henName(m.h) + '</b>' + m.h.p + '/' + t('min');
    el.ovReveal.style.setProperty('--rc', RAR[m.h.r].cor);
    if (!rev.skip || last) emit('reveal', { r: m.h.r, stage: 'hatched' });
  }
  function multiInfo() {
    const list = rev.multi.map((m) => m.h), best = rev.r;
    const sum = list.reduce((a, h) => a + h.p, 0), hour = list.reduce((a, h) => a + h.p * 60 * goldK(h.r), 0) * abatMult() * (1 - CFG.collectBurn);
    el.ovReveal.style.setProperty('--rc', RAR[best].cor);
    el.ovReveal.classList.add('hatched');
    el.revHint.hidden = true;
    el.revKick.textContent = '';
    el.revRar.textContent = t(RAR[best].nome);
    el.revRate.textContent = sum + '/' + t('min');
    el.revPay.textContent = '+' + fmt(hour) + '/' + t('h');
    el.revPlace.innerHTML = '<button type="button" class="place on" data-close="1"><b>' + t('Soltar na granja') + '</b></button>';
    el.revInfo.hidden = false;
    el.revPlace.querySelector('button').focus();
    stars(el.ovReveal.querySelector('.reveal'), best >= 2 ? 26 : 14);
    if (best >= 4) confetti();
  }
  function closeMulti() {
    const list = rev.multi.map((m) => m.h);
    syncHens();
    for (const h of list) emit('mint', { r: h.r, hen: W.hens.find((w) => w.id === h.id) });
    el.ovReveal.hidden = true; el.ovReveal.classList.remove('multi', 'hatched');
    el.revGrid.hidden = true; el.revGrid.innerHTML = '';
    rev.on = false; rev.multi = null; busy = false;
    H.closeSheet();
    save(); ui();
  }
  function hatch() {
    rev.hatched = true;
    if (rev.multi) { S.tutSeen.reveal = 1; multiInfo(); return; }
    S.tutSeen.reveal = 1;
    const r = rev.r;
    el.revHint.hidden = true;
    if (rev.fail) { failInfo(); return; }
    el.ovReveal.style.setProperty('--rc', RAR[r].cor);
    el.ovReveal.classList.add('hatched');
    const hen = S.hens[S.hens.length - 1];
    el.revRar.textContent = henName(hen);
    el.revRate.textContent = hen.p + '/' + t('min');
    el.revKick.textContent = '';
    el.revPay.textContent = perHourTxt(hen) + '/' + t('h') + (RAR[r].gold ? ' · ' + pct(RAR[r].gold) + ' ' + t('dourados') : '');
    renderPlace();
    el.revInfo.hidden = false;
    const first = el.revPlace.querySelector('.on') || el.revPlace.querySelector('button');
    if (first) first.focus();
    stars(el.ovReveal.querySelector('.reveal'), r >= 2 ? 26 : 14);
    if (r >= 4) confetti();
    emit('reveal', { r, stage: 'hatched' });
  }
  // Falhou: o ovo racha cinza, a tela treme e mostra quem se perdeu, a chance que era e a taxa queimada.
  function failInfo() {
    const f = rev.fuse, d = rev.fail;
    el.ovReveal.classList.add('failed');
    el.revKick.textContent = t('A fusão falhou');
    el.revRar.textContent = '-1 ' + t(RAR[f.from].nome);
    el.revRate.textContent = d.p + '/' + t('min');
    el.revPay.textContent = pct(f.chance) + ' · -' + fmt(f.fee);
    el.revPlace.innerHTML = '<button type="button" class="place" data-close="1"><b>' + t('Voltar') + '</b></button>';
    el.revInfo.hidden = false;
    el.revPlace.querySelector('button').focus();
    emit('error'); emit('fuseFail', { r: f.from });
  }
  // Botões "soltar no celeiro N", com o risco de raposa de cada um: a escolha é do jogador.
  function renderPlace() {
    const hen = S.hens[S.hens.length - 1];
    // celeiro que ainda não abriu só aparece para quem não coube nos outros: ela espera lá
    el.revPlace.innerHTML = PENS.map((p, i) => {
      if (i >= S.pens && hen.pen !== i) return '';
      const n = countIn(i) - (hen.pen === i ? 1 : 0), full = n >= perPen(i);
      return '<button type="button" class="place' + (hen.pen === i ? ' on' : '') + '" data-pen="' + i + '"' + (full ? ' disabled' : '') + '><b>' + t('Celeiro') + ' ' + (i + 1) + '</b><small>' + (i < S.pens ? n + '/' + perPen(i) : t('Espera a obra')) + '</small></button>';
    }).join('');
  }
  function placeHen(pen) {
    if (!rev.hatched) return;
    const hen = S.hens[S.hens.length - 1];
    hen.pen = pen;
    syncHens();
    emit('mint', { r: rev.r, hen: W.hens.find((h) => h.id === hen.id) });
    el.ovReveal.hidden = true;
    rev.on = false; busy = false;
    H.closeSheet();                                         // a recompensa é ver a galinha nova na cena
    save(); ui();
  }

  // ---------- ovos e chocadeira: cada celeiro tem a sua

  const penEggs = (i) => S.eggs.filter((e) => e.pen === i);
  function sellEgg(i) {
    const e = penEggs(i)[0];
    if (!e || busy) return;
    S.eggs.splice(S.eggs.indexOf(e), 1);
    const v = CFG.eggSell;
    S.nug += v; S.earned += v; S.sold++;
    emit('eggSold', { eggs: [e], v });
    bump();
    save(); ui();
  }
  function sellEggs() {
    const n = S.eggs.length;
    if (!n || busy) return;
    const sold = S.eggs.splice(0, n), v = n * CFG.eggSell;
    S.nug += v; S.earned += v; S.sold += n;
    emit('eggSold', { eggs: sold, v });
    bump();
    toast('<b>+' + fmt(v) + '</b>');
    save(); ui();
  }
  function incubate(i) {
    const e = penEggs(i)[0];
    if (busy || S.choc[i] || !e) return;
    if (!spend(CFG.hatchNug)) return;
    S.eggs.splice(S.eggs.indexOf(e), 1);
    S.choc[i] = { left: CFG.hatchHours };
    emit('incubate', { egg: e, pen: i });
    save(); ui();
  }
  function openChoc(i) {
    const k = S.choc[i];
    if (busy || !k || k.left > 0) return;
    if (S.hens.length >= slots()) { toast(t('Sem vaga'), 'bad'); emit('error'); return; }
    S.choc[i] = null; S.hatched++;
    const r = roll();
    S.hens.push(newHen(r, i < S.pens && countIn(i) < perPen(i) ? i : freePen()));
    S.got++;
    coopCheck();
    busy = true; save();
    startReveal(r, 'choc');
  }
  // Ovo pronto sem vaga: vende pelo mesmo preço de um ovo do ninho e libera a chocadeira.
  function sellChoc(i) {
    const k = S.choc[i];
    if (busy || !k || k.left > 0) return;
    const v = CFG.eggSell;
    S.choc[i] = null;
    S.nug += v; S.earned += v; S.sold++;
    bump();
    toast('<b>+' + fmt(v) + '</b>');
    save(); ui();
  }
  // Troca o HTML sem perder o toque nem o foco: com o dedo na folha espera soltar, e o botão que continua existindo fica focado.
  let sheetPress = false;
  const setHTML = (node, html) => {
    if (node._h === html || (sheetPress && el.sheet.contains(node))) return;
    const f = document.activeElement, a = f && node.contains(f) ? f.dataset.a : null, v = a ? f.dataset.v : null;
    node.innerHTML = html; node._h = html;
    if (!a) return;
    const b = node.querySelector('[data-a="' + a + '"]' + (v != null ? '[data-v="' + v + '"]' : ''));
    (b && !b.disabled ? b : el.sheetClose).focus({ preventScroll: true });
  };

  // ---------- avisos: um só por vez no #cue, com seta na cena. Perda > tutorial > decisão > conselho.

  // Ensinar é papel do tutorial do começo e do "Como jogar": aqui só entra perda acontecendo e decisão pendente.
  const CUE_MIN = 1200, CUE_QUIET = 45000;                  // ms: tempo mínimo na tela, silêncio antes de um conselho
  const cueOff = {};
  let cueNow = null, cueAt = 0, cueQuiet = 0, cuePress = false, cueP1 = '', biteAt = -9;
  const penAt = (i) => [PENS[i].x + PENS[i].w / 2, PENS[i].z + PENS[i].d / 2];

  function cueList() {
    const free = slots() - S.hens.length, ne = S.eggs.length, fx = W.fox;
    const pato = S.nug >= duckPrice() && S.ducks < CFG.duckMax ? { btn: t('Pato') + ' ' + fmt(duckPrice()), act: buyDuck } : { btn: t('Defesa'), act: () => H.openSheet('fox') };
    const c = [];

    // P1: perda acontecendo agora, sem ×. Sem pintinho na estrada a raposa não é perda: a folga evita piscar entre um pintinho e outro.
    if (foxBiting()) biteAt = W.time;
    if (fx && fx.state === 'eat' && !fx.dies && !W.full && (!fx.armed || fx.shot) && W.time - biteAt < 2.5)
      c.push(Object.assign({ k: 'bite', tier: 1, sig: 1, at: [fx.x, fx.z], txt: '<b>' + t('Raposa comendo pintinhos!') + '</b>', live: fx.eaten >= 1 ? '-' + fmt(fx.eaten) : '' }, pato));
    const th = W.thief;
    if (th && th.state === 'come' && !th.armed) c.push({ k: 'thief', tier: 1, sig: 1, at: [th.x, th.z], btn: t('Defesa'), act: () => H.openSheet('fox'), txt: '<b>' + t('Ladrão de galinhas!') + '</b>' });
    const floor = S.dirt.findIndex((d, i) => i < S.pens && W.penCount[i] && d >= 1);
    if (floor >= 0) c.push({ k: 'dirty', tier: 1, sig: floor, at: penAt(floor), btn: t('Limpar'), act: () => cleanPen(floor), txt: '<b>' + t('Celeiro sujo') + '</b> ' + Math.round(penMult(floor) * 100) + '%' });

    // P2: decisão, o × vale até a situação mudar
    const rp = S.choc.findIndex((k) => k && k.left <= 0);
    if (rp >= 0) c.push({ k: 'ready', tier: 3, sig: rp, at: penAt(rp), btn: free > 0 ? t('Abrir') : t('Ver'), act: () => (free > 0 ? openChoc(rp) : H.openSheet('barn', rp)), txt: '<b>' + t('O ovo chocou!') + '</b>' });
    if (ne >= CFG.nestMax) c.push({ k: 'nest', tier: 3, sig: 1, at: penAt(S.eggs[ne - 1].pen), btn: t('Vender todos'), act: sellEggs, txt: '<b>' + t('Ninho cheio') + '</b>' });
    const egg = ne ? S.eggs.find((e) => !S.choc[e.pen]) : null;
    if (egg) c.push({ k: 'egg', tier: 3, sig: ne, at: penAt(egg.pen), btn: t('Ver'), act: () => H.openSheet('barn', egg.pen), txt: '<b>' + t('Sua galinha botou!') + '</b>' });
    const ripe = S.zones.findIndex((z) => z.seed && z.left <= 0 && !S.farmer);
    if (ripe >= 0) { const zn = MAP.zones[ripe]; c.push({ k: 'plot', tier: 3, sig: ripe, at: [zn.x + zn.w / 2, zn.z + 2], btn: t('Colher'), act: harvestAll, txt: '<b>' + t('Horta pronta') + '</b>' }); }
    return c;
  }
  function renderCue() {
    if (cuePress) return;                                     // dedo em cima do aviso: nada muda até soltar
    const hide = !!sheetTab || busy || guide.on, now = Date.now(), list = cueList();
    if (now < cueAt) cueAt = now - CUE_MIN;                   // relógio do sistema voltou: o tempo mínimo já venceu
    for (const k in cueOff) if (!list.some((x) => x.k === k)) delete cueOff[k];
    if (cueP1 && !list.some((x) => x.k === cueP1)) cueP1 = '';
    let c = hide ? null : list.find((x) => cueOff[x.k] !== String(x.sig) && (x.tier < 4 || now - cueQuiet >= CUE_QUIET)) || null;
    // um aviso fica um tempo mínimo na tela, para não sumir no meio do clique; só perda entra por cima
    if (!hide && cueNow && !(c && c.k === cueNow.k) && !(c && c.tier === 1) && now - cueAt < CUE_MIN) c = list.find((x) => x.k === cueNow.k) || cueNow;
    if (c && !(cueNow && c.k === cueNow.k)) cueAt = now;
    if (c && c.tier === 1 && c.k !== cueP1) { cueP1 = c.k; if (c.k !== 'bite' && H.sfx) H.sfx.play('aviso'); }   // a raposa já tem alarme próprio
    cueNow = c;
    if (c && c.tier < 4) cueQuiet = now;
    W.cue = c && c.at ? { key: c.k, at: c.at } : null;
    el.cue.hidden = !c;
    if (!c) return;
    el.cue.classList.toggle('p1', c.tier === 1);
    setHTML(el.cue, '<p>' + c.txt + (c.live != null ? ' <span class="cue-live"></span>' : '') + '</p>' + (c.btn ? '<button type="button" class="cue-go">' + c.btn + '</button>' : '')
      + (c.tier > 1 ? '<button type="button" class="cue-x" aria-label="' + t('Fechar') + '">×</button>' : ''));
    if (c.live != null) el.cue.querySelector('.cue-live').textContent = c.live;
  }
  function onCueClick(e) {
    const c = cueNow;
    cuePress = false;
    if (!c) return;
    if (e.target.closest('.cue-x')) {
      cueOff[c.k] = String(c.sig);
      cueAt = 0; save(); renderCue();
    } else if (e.target.closest('.cue-go')) {
      cueAt = 0; c.act(); renderCue();
    }
  }

  // ---------- tutorial: frases curtas, a câmera anda até cada parte e o jogo mostra a coisa acontecendo
  // Roda numa granja de exemplo, com as regras de verdade em 60x. A granja do jogador fica guardada e volta intacta; nada do exemplo é salvo.
  // cam: [x, z, aproximação] em unidades do mapa. lit: o que fica colorido e brilhando na cena, com todo o resto sem cor; el: elementos da página que brilham junto.
  // on: monta a cena (at agenda o que acontece depois); tick: roda a cada quadro; loop: segundos até a cena recomeçar.
  // act: o botão que faz acontecer (run), que vira Próximo depois de tocado; ready: quando ele libera; tap: o que, tocado na cena, vale o mesmo que o botão.
  const at = (s, fn) => demo.plan.push([s, fn]);
  const say = (x, z, txt) => { if (R.say) R.say(x, z, txt); };
  const demoSleep = (e) => { for (const d of S.hens) { d.rest = true; d.e = e; } };
  const demoHunter = (lv) => { S.hunter = W.hunter = lv; emit('hunter', { level: lv }); };
  const GUIDE = [
    { t: 'Suas galinhas', pic: 'hen', cam: [24, 42, 2.8], lit: ['pens', 'belts'], txt: 'Elas soltam pintinhos. Quanto mais rara a galinha, mais ela produz.', loop: 5.4,
      on() { W.hens.forEach((h, i) => at(0.5 + i * 1.5, () => say(h.x, h.z, t(RAR[h.r].nome) + ' ' + h.d.p + '/min'))); } },
    { t: 'Esteira', pic: 'belt', cam: [62, 40, 1.5], lit: ['belts', 'abat'], txt: 'Os pintinhos vão até o abatedouro e viram $NUGGET.' },
    { t: 'Caminhão', pic: 'truck', cam: [90, 30, 2], lit: ['bin', 'truck'], el: ['#btnCollect'], txt: 'Os nuggets enchem a caixa. Chame o caminhão antes que ela lote.',
      on() { S.vault = cap() * 0.9; },
      act: 'Chamar caminhão', tap: ['bin', 'truck'], run() { collect(); } },
    { t: 'Descanso', pic: 'bed', cam: [24, 40, 2.8], lit: ['pens'], txt: 'Cansada, a galinha dorme e para de produzir. Toque para acordar.',
      on() { at(1, () => demoSleep(CFG.wakeMin)); },
      act: 'Acordar', tap: ['pen'], ready: () => demo.t > 3, run() { wakeHens(0); } },
